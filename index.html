document.documentElement.setAttribute('data-theme',t);})();

<style>
:root{--bg:#f9fafb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#f1f2f4;--line2:#e5e7eb;--field:#f3f4f6;--g:#0d4a3a;--gtext:#0d4a3a;--g2:#e8f4f0;--onG:#fff;--ok:#059669;--glass:rgba(255,255,255,.9);--sh:0 1px 2px rgba(0,0,0,.05);--pvbg:#F5F5F7;--navg:rgba(255,255,255,.85);color-scheme:light}
:root[data-theme="dark"]{--bg:#0b1210;--card:#141c19;--text:#e8efec;--muted:#9aa8a2;--line:#26332e;--line2:#2c3a35;--field:#1b2622;--g:#1f8f6d;--gtext:#5fd0ab;--g2:#143a30;--ok:#34d399;--glass:rgba(20,28,25,.92);--sh:none;--pvbg:#0b1210;--navg:rgba(20,28,25,.85);color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 8px}
.row1{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.logo span{display:flex;align-items:center;height:36px;padding:0 12px;border-radius:10px;background:var(--g)}.logo img{display:block;height:20px;width:auto}
.camp{display:inline-flex;align-items:center;gap:4px;margin-top:6px;max-width:230px;font-size:12px;font-weight:600;color:var(--gtext)}
.camp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.camp .ic{width:14px;height:14px}
.btns{display:flex;gap:8px}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);color:var(--muted)}
.search{display:block;position:relative;margin-bottom:12px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9ca3af;width:18px;height:18px}
.search input{width:100%;padding:10px 16px 10px 40px;background:var(--field);border:2px solid transparent;border-radius:12px;outline:0;font-size:16px}
.search input:focus{border-color:var(--g);background:var(--card)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 12px;overscroll-behavior-x:none;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 24px),transparent)}
.chips::after{content:"";flex:none;width:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 16px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--g);border-color:var(--g);color:var(--onG);box-shadow:0 4px 8px rgba(13,74,58,.25)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
.ph{position:relative;aspect-ratio:1;background:var(--field);display:grid;place-items:center;font-size:44px;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:8px;top:8px;max-width:calc(100% - 56px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:#f3f4f6;color:#4b5563}
.tag.new{background:#dbeafe;color:#1d4ed8}.tag.like{background:#f3e8ff;color:#7e22ce}.tag.used{background:#fef3c7;color:#b45309}
.heart{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--glass);color:var(--text)}
.heart .ic{width:16px;height:16px}.heart.on{color:#e0394b}.heart.on .ic{fill:#e0394b}
.cbody{padding:12px;display:flex;flex-direction:column;flex:1}
.ttl{font-size:14px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.price{font-size:16px;font-weight:700;color:var(--gtext)}
.sel{display:flex;align-items:center;gap:4px;margin-top:8px;color:var(--muted);font-size:12px;min-width:0}
.sel b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px}
.sel .ic{width:14px;height:14px;color:var(--ok);fill:var(--ok);stroke:var(--card)}
.trust{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--g2);color:var(--gtext)}
.sk{animation:sk 1.4s ease-in-out infinite;background:var(--line2)}
@keyframes sk{50%{opacity:.45}}
.skc{border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.skc i{display:block}
.empty{grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--muted)}
.empty h3{color:var(--text);font-size:17px;margin-bottom:6px}
.btn{display:inline-block;margin-top:14px;padding:11px 20px;border-radius:12px;background:var(--g);color:var(--onG);font-weight:700}
.more{display:block;margin:0 auto 16px;padding:11px 22px;border-radius:12px;background:var(--g2);color:var(--gtext);font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--navg);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -4px 20px rgba(0,0,0,.05);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;height:64px;padding:0 8px}
.nav a,.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;width:64px;height:100%;gap:4px;font-size:10px;font-weight:500;color:#9ca3af}
.nav .on{color:var(--gtext)}
.nav .on .ic{stroke-width:2.5}
.nav .ic{width:22px;height:22px}
.nav .sell i{display:grid;place-items:center;padding:8px;border-radius:50%;background:var(--g);color:var(--onG);transform:translateY(-8px);box-shadow:0 8px 16px rgba(13,74,58,.3)}
.nav .sell .ic{width:24px;height:24px;stroke:#fff}
.sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;background:rgba(0,0,0,.45)}
.sheet.open{display:flex}
.panel{width:100%;max-width:560px;margin:0 auto;max-height:82vh;display:flex;flex-direction:column;background:var(--card);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.panel h2{font-size:18px;margin-bottom:10px}
.panel input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);outline:0;font-size:16px;margin-bottom:8px}
.list{overflow-y:auto}
.list button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid var(--line)}
.list button.on{color:var(--gtext);font-weight:700}
.list small{color:var(--muted)}
.pv .top,.pv #grid,.pv #moreWrap{display:none}
#profileView{display:none;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 8px}
.pv #profileView{display:block}
.ph1{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.pav{width:64px;height:64px;border-radius:50%;background:var(--g);color:var(--onG);display:grid;place-items:center;font-size:26px;font-weight:800;flex:none}
.pname{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:700;flex-wrap:wrap}
.pname .ic{width:18px;height:18px;color:var(--ok);fill:var(--ok);stroke:var(--card)}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.pstats div{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:12px 8px;text-align:center}
.pstats b{display:block;font-size:20px;font-weight:800}.pstats span{font-size:12px;color:var(--muted)}
.ptl{font-size:16px;font-weight:700;margin:20px 0 10px}
.mrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.mrow .t{font-weight:600}.mrow .s{font-size:12px;color:var(--muted);margin:2px 0 10px}
.st{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--g2);color:var(--gtext);font-size:11px;font-weight:700;text-transform:capitalize}
.st.sold,.st.expired,.st.archived{background:var(--field);color:var(--muted)}.st.draft{background:#fef3c7;color:#92400e}
.macts{display:flex;gap:8px;flex-wrap:wrap}
.macts button{flex:1;padding:9px 10px;border-radius:10px;border:1.5px solid var(--g);background:transparent;color:var(--gtext);font-size:13px;font-weight:600}
.macts .fill{background:var(--g);color:var(--onG)}
.lrow{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:14px 12px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-weight:600}
.lrow small{color:var(--muted);font-weight:500}
.lrow.out{color:#dc2626}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}

<template id="tplTerms"><p class="upd">Last updated: November 5, 2026</p>
<h4>1. About Sureo</h4>
<p>Sureo is an online marketplace that connects students and staff of Nigerian universities so they can buy, sell, rent, trade and order food and services. <b>Sureo is a platform only.</b> Unless we expressly say otherwise, we are not the seller, buyer, or owner of any item or service listed, and we are not a party to any deal between users.</p>
<h4>2. Eligibility and accounts</h4>
<ul><li>You must be 18 or older, or have a parent/guardian's permission, and be able to form a binding contract in Nigeria.</li>
<li>You must give accurate information and keep your password secure. You are responsible for all activity on your account.</li>
<li>One person, one account. Impersonating someone else or using false identity or student details is prohibited.</li></ul>
<h4>3. Seller verification (KYC)</h4>
<p>To sell, we require your matric number, a photo of your student ID and a selfie holding it. We use these only to verify who you are, prevent fraud, and meet legal obligations. A "Verified" badge means you passed our checks at the time; it is <b>not</b> a guarantee of an item's quality or a user's conduct.</p>
<h4>4. Listings and prohibited items</h4>
<p>You may only list items you own or are authorised to sell, described honestly with real photos. You must not list or promote:</p>
<ul><li>Illegal goods, stolen goods, counterfeits or pirated material</li>
<li>Drugs, weapons, or anything harmful or hazardous</li>
<li>Exam papers, answers, assignment-writing or any academic-cheating service</li>
<li>Adult content, hateful content, or anything that harasses or deceives others</li>
<li>Scams, advance-fee schemes, or requests to move payment off Sureo to avoid protections</li></ul>
<p>We may remove listings and suspend or ban accounts that break these rules.</p>
<h4>5. Payments, fees and refunds</h4>
<ul><li><b>Online payments:</b> Online payments are processed by Paystack. Funds go directly to the seller's verified Paystack subaccount; Sureo does not hold or release your money. An order is marked as paid only after Paystack confirms the charge, never because a user says so.</li>
<li><b>Pay on delivery:</b> You may instead choose to pay cash or by POS when you meet at a campus safety hub. Sellers must never share personal bank account numbers in chat or ask for off-platform transfers.</li>
<li>We recommend meeting in a public place, inspecting the item before you pay, and never paying for something you have not seen. Paying in advance to a stranger is at your own risk.</li>
<li>Sureo does not currently charge buyers a fee. Paystack may apply its own processing charges. We will tell you in advance if we introduce fees and update these Terms.</li>
<li>If an item is not delivered or is not as described, report the listing or user in the app and email support@sureo.name.ng with your order details. We may remove listings or suspend accounts. Refunds for online payments are handled through Paystack and the seller; we cannot refund cash paid on delivery.</li></ul>
<h4>6. Meeting safely</h4>
<p>Meet in public campus locations, preferably the Safety Hubs shown in the app. Inspect items before confirming. Never share your PIN, OTP or password with anyone, including people claiming to be Sureo staff.</p>
<h4>7. Reviews, reports and disputes</h4>

function b64u(s){const b=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'),r=atob(b);return Uint8Array.from(Array.from(r).map(c=>c.charCodeAt(0)));}
const pushOK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const isIOS=()=>/iphone|ipad/i.test(navigator.userAgent);
const isStandalone=()=>window.navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
function pushLabel(){return pushOK()&&Notification.permission==='granted'?'On':'Off';}
async function enablePush(quiet){
  if(!pushOK()){if(!quiet)toast(isIOS()?'On iPhone: tap Share, then Add to Home Screen, then open Sureo from your home screen and try again.':'This browser does not support notifications.',7000);return;}
  try{
    if(Notification.permission!=='granted'){if(quiet)return;const p=await Notification.requestPermission();if(p!=='granted'){toast('Notifications are blocked. Allow them in your phone settings.',5000);return;}}
    if(!ME)return;
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID)});
    const {error}=await sb.rpc('save_push',{p_endpoint:sub.endpoint,p_sub:sub.toJSON()});
    if(error)throw error;
    const x=$('pushSub');if(x)x.textContent='On';if(!quiet)toast('🔔 Notifications are on.');
  }catch(e){if(!quiet)toast('Could not turn on notifications: '+(e.message||e),6000);}
}
function pushInit(){
  try{
    if(!pushOK()){
      if(isIOS()&&!isStandalone()&&!localStorage.getItem('sureoIosHint')){localStorage.setItem('sureoIosHint','1');toast('To get alerts on iPhone: tap Share, then Add to Home Screen, then open Sureo from there.',8000);}
      return;
    }
    if(Notification.permission==='granted'){if(ME)enablePush(true);return;}
    if(Notification.permission!=='default')return;
    const last=+localStorage.getItem('sureoPushAsk')||0;
    if(Date.now()-last<3*864e5)return;
    const go=()=>{window.removeEventListener('click',go,true);try{localStorage.setItem('sureoPushAsk',Date.now());}catch(e){}enablePush(false);};
    window.addEventListener('click',go,true);
  }catch(e){}
}

/* ---------- My listings: cursor pagination (15 per page) + windowed list ---------- */
/* Rows have a fixed height, so only the rows on screen (plus a few spare) exist in the page. */
const VL={tab:'active',cat:'all',total:0,rows:[],cursor:null,done:false,busy:false,err:false,gen:0,key:''};
const VCATS=[['all','All'],['food','Food'],['gadgets','Gadgets'],['books','Books'],['fashion','Fashion'],['services','Services']];
const NOUN={active:'active',sold:'sold',archived:'archived',draft:'draft'};
const VCFG={active:{H:128,G:10},draft:{H:128,G:10},archived:{H:128,G:10},sold:{H:60,G:8}};
const VEMPTY={active:['No active listings','Tap Sell to post an item.'],sold:['No sales history yet','Items you mark as sold will show here.'],archived:['No archived listings','Archived listings show here. Renew one to put it back on the market.'],draft:['No drafts','Unfinished listings will show here.']};
const priceOf=l=>l.type==='free'?'Free':fmtNaira((l.price_kobo||0)/100,l.category,l.type);
function vRow(l,top,c){
  const id=esc(l.id),pos='style="top:'+top+'px;height:'+c.H+'px"';
  if(VL.tab==='sold')return '<div class="vr vm" '+pos+'><div style="min-width:0;flex:1"><div class="t">'+esc(l.title)+'</div><div class="s">Posted '+ago(l.created_at)+'</div></div><b>'+priceOf(l)+'</b><button class="relist" data-ma="sold" data-id="'+id+'">Relist</button></div>';
  const s=statusOf(l),btn=VL.tab==='draft'?'<button class="fill" data-ma="publish" data-id="'+id+'">Publish</button>':VL.tab==='archived'?'<button class="fill" data-ma="renew" data-id="'+id+'">Renew</button>':'<button data-ma="renew" data-id="'+id+'">Renew</button><button class="fill" data-ma="sold" data-id="'+id+'">Mark Sold</button>';
  return '<div class="vr vc" '+pos+'><div class="t">'+esc(l.title)+'</div><div class="s">'+priceOf(l)+' · <span class="st '+esc(s)+'">'+(s==='active'?'Active':esc(s))+'</span> · posted '+ago(l.created_at)+'</div><div class="macts"><button data-ma="edit" data-id="'+id+'">Edit</button>'+btn+'</div></div>';
}
function vlRender(force){
  const box=$('vlist');if(!box)return;
  const c=VCFG[VL.tab],P=c.H+c.G,n=VL.rows.length,sk=VL.busy?2:0;
  box.style.height=((n+sk)*P)+'px';
  const top=box.getBoundingClientRect().top,vh=window.innerHeight;
  const a=Math.max(0,Math.floor(-top/P)-3),b=Math.min(n+sk,Math.ceil((vh-top)/P)+3);
  const key=[VL.tab,a,b,n,sk,VL.err].join('|');
  if(!force&&key===VL.key)return;VL.key=key;
  let out='';for(let i=a;i<b;i++)out+=i<n?vRow(VL.rows[i],i*P,c):'<div class="vr sk" style="top:'+(i*P)+'px;height:'+c.H+'px;border-radius:12px"></div>';
  box.innerHTML=out;
  const vc=$('vcount');if(vc)vc.textContent=VL.total>15&&n?'Showing '+n+' of '+VL.total+' '+NOUN[VL.tab]+' listings':'';
  const catL=(VCATS.find(x=>x[0]===VL.cat)||[])[1];
  $('vempty').innerHTML=VL.err?'<div class="mrow"><div class="t">Couldn’t load listings</div><div class="s">Check your connection.</div><div class="macts"><button class="fill" data-ma="retry">Try again</button></div></div>':(VL.done&&!n?'<div class="mrow"><div class="t">'+(VL.cat==='all'?VEMPTY[VL.tab][0]:'Nothing in '+catL)+'</div><div class="s" style="margin:2px 0 0">'+(VL.cat==='all'?VEMPTY[VL.tab][1]:'Try another category or tab.')+'</div></div>':'');
  if(!VL.done&&!VL.busy&&!VL.err&&b>=n-2)vlMore();
}
async function vlMore(){
  if(VL.busy||VL.done||!ME||!$('vlist'))return;
  VL.busy=true;VL.err=false;const gen=VL.gen;vlRender(true);
  const first=!VL.cursor;
  let q=sb.from('listings').select('id,title,price_kobo,status,type,category,created_at',first?{count:'exact'}:{}).eq('seller_id',ME.id).eq('status',VL.tab);
  if(VL.cat!=='all')q=q.eq('category',VL.cat);
  q=q.order('created_at',{ascending:false}).order('id',{ascending:false}).limit(15);
  if(VL.cursor)q=q.or('created_at.lt.'+VL.cursor.c+',and(created_at.eq.'+VL.cursor.c+',id.lt.'+VL.cursor.id+')');
  const {data,error,count}=await q;
  if(gen!==VL.gen)return;
  VL.busy=false;
  if(error){console.error(error);VL.err=true;vlRender(true);return;}
  if(first&&count!=null)VL.total=count;
  VL.rows.push(...data);if(data.length<15)VL.done=true;
  if(data.length){const z=data[data.length-1];VL.cursor={c:z.created_at,id:z.id};}
  vlRender(true);
}
function vlReset(tab){
  VL.gen++;if(tab)VL.tab=tab;VL.total=0;VL.rows=[];VL.cursor=null;VL.done=false;VL.busy=false;VL.err=false;VL.key='';
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.vt===VL.tab));
  document.querySelectorAll('#vcats button').forEach(b=>b.classList.toggle('on',b.dataset.vc===VL.cat));
  vlMore();
}
async function updCount(){try{const r=await sb.from('listings').select('id',{count:'exact',head:true}).eq('seller_id',ME.id);const e=$('nList');if(e&&r.count!=null)e.textContent=r.count;}catch(e){}}
let vraf=0;
window.addEventListener('scroll',()=>{if(vraf||!$('vlist'))return;vraf=requestAnimationFrame(()=>{vraf=0;if(document.body.classList.contains('pv'))vlRender();});},{passive:true});
window.addEventListener('resize',()=>{if($('vlist')&&document.body.classList.contains('pv'))vlRender(true);});
let editId=null;
async function myAction(b){
  const a=b.dataset.ma,l=VL.rows.find(x=>x.id===b.dataset.id);
  if(a==='cancel'){$('esheet').classList.remove('open');return;}
  if(a==='del'){
    const row=VL.rows.find(x=>x.id===editId);
    if(await askText({title:'Delete this listing?',help:'“'+((row&&row.title)||$('eName').value)+'” will be removed permanently.',noText:true,ok:'Delete',danger:true})===null)return;
    const {error}=await sb.from('listings').delete().eq('id',editId).eq('seller_id',ME.id);
    if(error){toast('Could not delete: '+error.message);return;}
    rmFolder('listing-media',ME.id+'/'+editId);
    $('esheet').classList.remove('open');toast('Listing deleted.');vlReset();load();updCount();return;
  }
  if(a==='retry'){VL.err=false;vlMore();return;}
  if(a==='save'){
    const name=$('eName').value.trim(),pz=Math.max(0,parseInt($('ePrice').value.replace(/\D/g,''),10)||0);if(!name){$('eName').focus();return;}
    const {error}=await sb.from('listings').update({title:name,price_kobo:pz*100}).eq('id',editId).eq('seller_id',ME.id);
    if(error){toast('Could not save: '+error.message);return;}
    $('esheet').classList.remove('open');toast('Listing updated');vlReset();load();return;
  }
  if(!l||!ME)return;
  if(a==='edit'){editId=l.id;$('eName').value=l.title;$('ePrice').value=commaNum(Math.round(l.price_kobo/100));$('esheet').classList.add('open');return;}
  if(a==='renew'){const upd={created_at:new Date().toISOString()};if(l.status==='archived')upd.status='active';const {error}=await sb.from('listings').update(upd).eq('id',l.id).eq('seller_id',ME.id);if(error){toast('Could not renew: '+error.message);return;}toast('Renewed. It is back at the top.');}
  if(a==='publish'){const {error}=await sb.from('listings').update({status:'active'}).eq('id',l.id).eq('seller_id',ME.id);if(error){toast('Could not publish: '+error.message);return;}toast('Listing is live.');}
  if(a==='sold'){const next=l.status==='sold'?'active':'sold';const {error}=await sb.from('listings').update({status:next}).eq('id',l.id).eq('seller_id',ME.id);if(error){toast('Could not update: '+error.message);return;}toast(next==='sold'?'Marked as sold. It is hidden from the market.':'Listing is live again.');}
  vlReset();load();updCount();
}

/* ---------- Seller view counts (same rule as the old app): signed-in viewer, not the seller, once per listing per device per day, when 60% of the card is seen ---------- */
const vo=new IntersectionObserver(es=>{es.forEach(en=>{
  if(!en.isIntersecting)return;vo.unobserve(en.target);
  const id=en.target.dataset.lid,it=ITEMS.find(x=>String(x.id)===id);
  if(!it||!ME||it.sid===ME.id)return;
  let seen={};try{seen=JSON.parse(localStorage.getItem('sureoViewed')||'{}');}catch(e){}
  const day=new Date().toISOString().slice(0,10);if(seen[id]===day)return;
  seen[id]=day;try{localStorage.setItem('sureoViewed',JSON.stringify(seen));}catch(e){}
  sb.rpc('add_view',{lid:id}).then(()=>{},()=>{});
});},{threshold:.6});
function trackViews(){document.querySelectorAll('#grid .card').forEach(c=>vo.observe(c));}

/* ---------- Events: one delegated listener, so late-added elements always work ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('a.card')&&!e.target.closest('[data-fav]'))FROMLIST=true;
  const t=e.target.closest('[data-fav],[data-cat],[data-act],[data-cid],[data-ma],[data-vt],[data-vc]');
  if(!t){if(e.target===$('sheet'))$('sheet').classList.remove('open');if(e.target===$('esheet'))$('esheet').classList.remove('open');return;}
  if(t.dataset.fav){
    e.preventDefault();const id=t.dataset.fav;FAV.has(id)?FAV.delete(id):FAV.add(id);
    try{localStorage.setItem('sureoFav',JSON.stringify([...FAV]));}catch(x){}
    t.classList.toggle('on',FAV.has(id));return;
  }
  if(t.dataset.vc){if(t.dataset.vc!==VL.cat){VL.cat=t.dataset.vc;vlReset();}return;}
  if(t.dataset.vt){if(t.dataset.vt!==VL.tab)vlReset(t.dataset.vt);return;}
  if(t.dataset.ma){myAction(t);return;}
  if(t.dataset.cat){st.cat=t.dataset.cat;paint();}
  else if(t.dataset.cid){st.campus=t.dataset.cid;$('sheet').classList.remove('open');load();}
  else if(t.dataset.act==='campus'){$('sheet').classList.add('open');$('cq').value='';paintCampuses();loadCampuses().then(paintCampuses);}
  else if(t.dataset.act==='theme')setTheme();
  else if(t.dataset.act==='push')enablePush(false);
  else if(t.dataset.act==='back'){if(FROMLIST){FROMLIST=false;history.back();}else{history.replaceState(null,'',location.pathname+location.search);closeDetail();}}
  else if(t.dataset.act==='share')shareListing(t);
  else if(t.dataset.act==='focus'){if(location.hash)location.hash='';window.scrollTo(0,0);setTimeout(()=>$('q').focus(),50);}
  else if(t.dataset.act==='store')shareStore();
  else if(t.dataset.act==='logout'){if(confirm('Log out of Sureo?'))logout();}
  else if(t.dataset.act==='retry')load();
  else if(t.dataset.act==='all'){st.campus='all';load();}
  else if(t.dataset.act==='more'){LIM+=40;load();}
});
const commaNum=v=>String(v).replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,10).replace(/\B(?=(\d{3})+(?!\d))/g,',');
$('ePrice').addEventListener('input',e=>{

});
$('q').addEventListener('input',e=>{st.q=e.target.value;paint();});

async function rmFolder(bucket,prefix){
  try{
    const {data}=await sb.storage.from(bucket).list(prefix,{limit:1000});
    if(!data||!data.length)return;
    const files=[];
    for(const f of data){if(f.id)files.push(prefix+'/'+f.name);else await rmFolder(bucket,prefix+'/'+f.name);}
    if(files.length)await sb.storage.from(bucket).remove(files);
  }catch(e){}
}

async function saveName(){
  const nm=$('aName').value.trim().replace(/\s+/g,' ');
  if(nm.length<2||nm.length>60)return aErr('Enter your name (2 to 60 characters).');
  const {error}=await sb.from('profiles').update({full_name:nm}).eq('id',ME.id);
  if(error)return aErr('Could not save. '+(error.message||'Try again.'));
  try{await sb.auth.updateUser({data:{full_name:nm}});}catch(x){}
  ACC.p.full_name=nm;if(MYPROF)MYPROF.full_name=nm;closeA();toast('✓ Profile updated.');
}
async function saveEmail(){
  const ne=$('aEmail').value.trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(ne))return aErr('Enter a valid email address.');
  if(ne===(ME.email||'').toLowerCase())return aErr('That is already your email.');
  const {error}=await sb.auth.updateUser({email:ne},{emailRedirectTo:location.origin+'/'});
  if(error)return aErr(error.message||'Could not change email. Try again.');
  openA('<h2>📩 Check your inbox</h2><p class="ss" style="margin-bottom:12px">We sent a confirmation link to '+esc(ne)+'. Tap it to finish. If you also get a message at your old email, tap that link too.</p><div class="macts"><button class="fill" data-ac="close" style="padding:12px">Done</button></div>');
}
async function savePass(){
  const x=$('aP1').value,y=$('aP2').value;
  if(x.length<8)return aErr('Password must be at least 8 characters.');
  if(x!==y)return aErr('The two passwords do not match.');
  const {error}=await sb.auth.updateUser({password:x});
  if(error)return aErr(error.message||'Could not update password. Try again.');
  closeA();toast('✓ Password updated.');
}
async function delAccount(){
  if($('aDel').value.trim()!=='DELETE')return aErr('Type DELETE in capital letters to confirm.');
  try{
    await rmFolder('kyc-private',ME.id);await rmFolder('listing-media',ME.id);
    const {error}=await sb.rpc('delete_my_account');if(error)throw error;
  }catch(e){return aErr('Could not delete account: '+(e.message||'try again'));}
  closeA();await logout('Your account has been deleted.');
}
async function submitKyc(){
  const matric=$('aMat').value.trim(),idf=$('aIdF').files[0],sf=$('aSfF').files[0];
  if(!matric)return aErr('Enter your matric number.');
  if(!idf||!sf)return aErr('Add your student ID and a selfie holding it.');
  const EXT={'image/jpeg':'jpg','image/png':'png','application/pdf':'pdf'};
  if(!EXT[idf.type])return aErr('Student ID must be a JPG, PNG or PDF.');
  if(!/^image\//.test(sf.type))return aErr('Selfie must be a photo.');
  if(idf.size>5*1024*1024||sf.size>8*1024*1024)return aErr('Each photo must be under 5 MB.');
  const t=Date.now(),idPath=ME.id+'/student-id-'+t+'.'+EXT[idf.type],sfPath=ME.id+'/selfie-'+t+'.'+(sf.type==='image/png'?'png':'jpg');
  let up=await sb.storage.from('kyc-private').upload(idPath,idf,{contentType:idf.type});
  if(up.error)return aErr('Upload failed: '+up.error.message);
  up=await sb.storage.from('kyc-private').upload(sfPath,sf,{contentType:sf.type==='image/png'?'image/png':'image/jpeg'});
  if(up.error)return aErr('Upload failed: '+up.error.message);
  const {error}=await sb.from('kyc').upsert({user_id:ME.id,id_type:null,id_last4:null,matric_no:matric,student_id_path:idPath,selfie_path:sfPath,status:'pending'});
  if(error)return aErr('Could not submit: '+error.message);
  ACC.k={matric_no:matric,status:'pending',student_id_path:idPath};closeA();paintAcct();
  toast('✓ Submitted! We’ll review your details and activate your Seller badge.');
}
function pickIdOnly(){
  if(!ACC.k){toast('Complete seller verification first, then your Student ID can be added.');$('acct').querySelector('[data-ac="verify"]')&&$('acct').querySelector('[data-ac="verify"]').click();return;}
  const inp=document.createElement('input');inp.type='file';inp.accept='image/jpeg,image/png,application/pdf';
  inp.addEventListener('change',async()=>{
    const f=inp.files[0];if(!f)return;
    const ext=({'image/jpeg':'jpg','image/png':'png','application/pdf':'pdf'})[f.type];
    if(!ext)return toast('Student ID must be a JPG, PNG or PDF.');
    if(f.size>5*1024*1024)return toast('Student ID file must be under 5 MB.');
    const path=ME.id+'/student-id-'+Date.now()+'.'+ext;
    toast('Uploading…');
    const up=await sb.storage.from('kyc-private').upload(path,f,{contentType:f.type});
    if(up.error)return toast('Upload failed: '+up.error.message);
    const {error}=await sb.from('kyc').update({student_id_path:path}).eq('user_id',ME.id);
    if(error)return toast('Could not save: '+error.message);
    ACC.k.student_id_path=path;paintAcct();toast('✓ Student ID uploaded.');
  });
  inp.click();
}
async function savePayout(){
  const bank=$('aBank').value,acct=$('aAcct').value.trim();
  if(!bank||!/^\d{10}$/.test(acct))return aErr('Choose your bank and enter a 10-digit account number.');
  const {error}=await sb.functions.invoke('paystack',{body:{action:'subaccount',bank_code:bank,account_number:acct}});
  if(error){let m='';try{const j=await error.context.json();m=j.error||'';}catch(_){}return aErr(m==='not_verified'?'Complete seller verification first.':(m||'Could not save. Try again.'));}
  ACC.p.paystack_subaccount='set';closeA();paintAcct();toast('✓ Payout account saved. You can now accept online payments.');
}

function badListingText(t){
t=String(t||'').toLowerCase();
if(/(\+?234|\b0)[\s.-]?[789][01]\d[\s.-]?\d{3}[\s.-]?\d{4}/.test(t)||/\d[\s.-]?\d[\s.-]?\d[\s.-]?\d[\s.-]?\d[\s.-]?\d[\s.-]?\d[\s.-]?\d[\s.-]?\d[\s.-]?\d/.test(t))return 'Please remove phone numbers from the title. Buyers contact you through Sureo.';
if(/whatsapp|telegram|call me|dm me|@gmail|@yahoo/.test(t))return 'Please remove contact details from the title.';
if(/\b(weed|cocaine|heroin|tramadol|codeine|molly|loud|gun|pistol|rifle|ammo|exam\s*(leak|runz|expo)|leaked\s*(questions|exam)|fake\s*(id|certificate|result))\b/.test(t))return 'This kind of item is not allowed on Sureo.';
return '';
}
async function squeeze(f){
if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size<250000)return f;
try{
const bm=await createImageBitmap(f),k=Math.min(1,1280/Math.max(bm.width,bm.height));
const c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));
return b&&b.size<f.size?new File([b],'p.jpg',{type:'image/jpeg'}):f;
}catch(e){return f;}
}

async function postListing(btn){
  if(SL.busy)return;
  const er=m=>{const e=$('sErr');e.textContent=m;e.style.display='block';};
  $('sErr').style.display='none';
  const n=$('sName').value.trim();if(!n)return er('Enter a title.');
  const bad=badListingText(n);if(bad)return er(bad);
  const ty=SL.ty,cat=SL.cat,c=SELL_CFG[cat],p=ty==='free'?0:(parseInt($('sPrice').value.replace(/\D/g,''),10)||0);
  const ph=waNum($('sPhone').value);if(!ph)return er('Enter a valid WhatsApp number, e.g. 08012345678');
  const files=SL.files.slice(0,5);
  for(const f of files){
    if(!MIME_EXT[f.type])return er('Use JPG, PNG, WebP photos or MP4 video.');
    if(f.size>20*1024*1024)return er('Each file must be under 20 MB.');
  }
  SL.busy=true;btn.disabled=true;btn.textContent='Posting…';
  try{
    const {data:l,error}=await sb.from('listings').insert({seller_id:ME.id,type:ty,category:cat,title:n,price_kobo:p*100,condition:c.cond?SL.cond:'N/A (Food / Service)',course_code:c.code?($('sCode').value.trim()||null):null,whatsapp:ph}).select('id').single();
    if(error)throw error;
    const rows=[];
    for(let i=0;i<files.length;i++){
      const f=await squeeze(files[i]),path=ME.id+'/'+l.id+'/'+i+'.'+MIME_EXT[f.type];
      const up=await sb.storage.from('listing-media').upload(path,f,{contentType:f.type});
      if(up.error)throw up.error;
      rows.push({listing_id:l.id,url:sb.storage.from('listing-media').getPublicUrl(path).data.publicUrl,kind:f.type.startsWith('video')?'video':'image',position:i});
    }

function drawOrders(){
  if(!OC)return;
  const {data,codes,dm}=OC,uid=ME.id;
  const conf=o=>o.handover_status==='confirmed';
  const autoClosed=o=>o.receipt==='assumed'||(o.receipt==null&&conf(o)&&o.handover_at&&Date.now()-new Date(o.handover_at)>7*864e5);
  const isDone=o=>o.buyer_id===uid?(conf(o)&&(o.receipt!=null||autoClosed(o))):conf(o);
  const unreplied=o=>o.seller_id===uid&&(dm[String(o.id)]||[]).some(d=>!d.seller_reply);
  const needsAct=o=>!isDone(o)||unreplied(o);
  const nAct=data.filter(needsAct).length;
  const badge=o=>{const b=o.buyer_id===uid;
    if(unreplied(o))return['Reply needed',1];
    if(isDone(o))return['Done',0];
    if(!conf(o))return[b?'Share code':'Enter code',1];
    return['Confirm receipt',1];};
  const list=data.filter(o=>ORD.f==='action'?needsAct(o):ORD.f==='selling'?o.seller_id===uid:ORD.f==='buying'?o.buyer_id===uid:isDone(o));
  const seg=[['action','To do'+(nAct?' '+nAct:'')],['selling','Selling'],['buying','Buying'],['done','Done']].map(c=>'<button type="button" class="'+(ORD.f===c[0]?'on':'')+'" data-of="'+c[0]+'">'+c[1]+'</button>').join('');
  const row=o=>{
    const b=o.buyer_id===uid,id=esc(o.id),bd=badge(o);let body='';
    if(b&&!conf(o))body+='<div class="ord-box">Your handover code<br><span class="code">'+esc(codes[String(o.id)]||'······')+'</span><br><small>Give this code to the seller only when the item is in your hand.</small></div>';
    if(!b&&!conf(o))body+='<div class="hrow"><input inputmode="numeric" maxlength="6" placeholder="Buyer’s 6-digit code" data-hc="'+id+'"><button data-hcb="'+id+'">Confirm</button></div>';
    if(b&&conf(o)){
      if(o.receipt==='received')body+='<div class="ord-box">✅ You confirmed you received this item.</div>';
      else if(o.receipt==='not_received')body+='<div class="ord-box">❌ You reported this item as not received.</div>';
      else if(autoClosed(o))body+='<div class="ord-box">🕒 Closed automatically after 7 days with no answer. If something is wrong, tap Report a problem.</div>';
      else body+='<div class="ord-box">📦 <b>Did you receive your item?</b><div class="hrow" style="margin-top:8px"><button data-rcy="'+id+'">Yes</button><button class="obtn ghost" data-rcn="'+id+'">No</button></div></div>';
    }
    if(!b&&conf(o))body+='<div class="ord-box">✅ Handover confirmed.</div>';
    body+=(dm[String(o.id)]||[]).map(d=>'<div class="ord-box">⚠️ <b>Buyer reported:</b> '+esc(d.reason)+'<br>'+(d.seller_reply?'<small>Your reply: '+esc(d.seller_reply)+'</small>':'<button class="obtn ghost" data-srep="'+esc(d.id)+'" style="margin-top:8px">Reply with your side</button>')+'</div>').join('');
    body+='<button class="obtn ghost" data-prob="'+id+'" style="align-self:flex-start">⚠️ Report a problem</button>';
    return '<details class="ord"><summary><span class="ord-ic">'+(b?'🛍️':'🏷️')+'</span><span class="ord-t"><b>'+esc(o.listing_title)+'</b><small>'+(b?'Buying':'Selling')+' · '+fmtN(o.amount_kobo)+'</small></span><span class="ob'+(bd[1]?' act':'')+'">'+bd[0]+'</span></summary><div class="ord-body">'+body+'</div></details>';
  };
  $('acct').innerHTML=aBar('Orders & Receipts')+'<div class="omax"><div class="oh">'+(nAct?nAct+' need'+(nAct===1?'s':'')+' your attention':'All up to date')+'</div><div class="seg" style="position:static">'+seg+'</div>'
  +(list.length?list.map(row).join(''):'<p class="ss" style="text-align:center;margin:26px 0">'+(ORD.f==='action'?'Nothing needs your attention 🎉':'No orders here.')+'</p>')
  +(data.length>=ORD.n?'<button type="button" class="omore" data-omore="1">Load more orders</button>':'')+'</div>';
}

      const m=error.message||'';

      if(/Gmail, Outlook, Hotmail, Yahoo or iCloud/i.test(m))return aErr('Please sign up with a Gmail, Outlook, Hotmail, Yahoo or iCloud email.');
      return aErr(m);
    }
    try{localStorage.setItem('sureoConsent',JSON.stringify({t:TERMS_V,p:PRIV_V}));}catch(x){}
    if(data.session)return auDone(data.session.user);
    AU.email=em;openAuth('code');return;
  }
  if(a==='verify'){
    const c=auVal('auC').replace(/\s/g,'');
    if(!/^\d{6}$/.test(c))return aErr('Enter the 6-digit code from your email.');
    auLoading(b,true);
    const {data,error}=await sb.auth.verifyOtp({email:AU.email,token:c,type:'signup'});
    auLoading(b,false);
    if(error)return aErr('That code is wrong or expired. Check it or tap Resend code.');
    await auDone(data.user);return;
  }
  if(a==='resend'){const {error}=await sb.auth.resend({type:'signup',email:AU.email});toast(error?error.message:'New code sent. Check your email.',4000);return;}
  if(a==='forgot'){
    const em=auVal('auE');if(!auMail(em))return aErr('Enter your email above, then tap Forgot password.');
    const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+'/old.html'});
    toast(error?error.message:'If an account exists, a reset link is on its way. Check your inbox.',5000);
  }
});

  chatBottom();

async function sendChat(id){

  SENDING=false;
  if(error){i.value=v;toast('Could not send: '+error.message);return;}
  const w=$('cmsgs');if(w){const e=w.querySelector('p.ss');if(e)e.remove();w.insertAdjacentHTML('beforeend','<div class="msg out">'+esc(v)+'<time>just now</time></div>');chatBottom();}
}

/* ---------- Buying (checkout) and Offers ---------- */
let CK=null,CKQ=1,CKM='paystack',OF=null;
const nmoney=n=>'₦'+Number(n||0).toLocaleString('en-NG');
async function getConv(lid,title,sid){
  const ex=await sb.from('conversations').select('id').eq('listing_id',lid).eq('buyer_id',ME.id).limit(1);
  if(ex.data&&ex.data[0])return ex.data[0].id;
  const {data,error}=await sb.from('conversations').insert({listing_id:lid,listing_title:title,buyer_id:ME.id,seller_id:sid,last_message:'',last_at:new Date().toISOString()}).select('id').single();
  if(error)throw new Error('Could not start chat: '+error.message);
  return data.id;
}
async function callPaystack(action,orderId){
  const {data,error}=await sb.functions.invoke('paystack',{body:{action:action,order_id:orderId}});
  if(error){let code='';try{const j=await error.context.json();code=j.error||'';}catch(_){}return {err:code||'failed'};}
  return {data:data};
}
function popupPay(code){
  return new Promise((res,rej)=>{
    try{new PaystackPop().resumeTransaction(code,{onSuccess:()=>res(true),onCancel:()=>res(false),onError:e=>rej(new Error((e&&e.message)||'Payment failed'))});}
    catch(e){rej(new Error('Payment window could not open. Check your connection.'));}
  });
}
async function payOnline(oid){
  if(typeof PaystackPop==='undefined')throw new Error('Paystack failed to load. Check your connection.');
  const ini=await callPaystack('init',oid);
  if(ini.err){
    if(ini.err==='seller_not_ready')throw new Error('This seller cannot take online payments yet. Choose pay on delivery.');
    if(ini.err==='already_paid')return true;
    throw new Error('Could not start payment. Try again.');
  }
  if(!(await popupPay(ini.data.access_code)))return false;
  for(let i=0;i<4;i++){const v=await callPaystack('verify',oid);if(v.data&&v.data.ok)return true;await new Promise(r=>setTimeout(r,2000));}
  throw new Error('We could not confirm your payment yet. If you were charged, email support@sureo.name.ng with your order.');
}
function openCheckout(b){
  if(!ME){toast('Sign in to order.');return;}
  const d=b.dataset;if(d.s===ME.id){toast("That's your own listing.");return;}
  CK={id:d.id,s:d.s,t:d.t,p:+d.p||0};CKQ=1;CKM='paystack';paintCk();
}
function paintCk(){
  const free=CK.p===0,tot=CK.p*CKQ;
  openA('<h3 style="margin-bottom:10px">Checkout</h3><div class="ord-box"><b>'+esc(CK.t)+'</b><br><span class="ss">Total: <b>'+(free?'FREE':nmoney(tot))+'</b></span></div>'
   +'<div style="display:flex;justify-content:space-between;align-items:center;margin:12px 0"><b>Quantity</b><div style="display:flex;align-items:center;gap:14px"><button class="round" data-q="-1" aria-label="Less">−</button><b>'+CKQ+'</b><button class="round" data-q="1" aria-label="More">+</button></div></div>'
   +(free?'':'<button class="lrow'+(CKM==='paystack'?' picked':'')+'" data-pm="paystack">💳 Pay online with Paystack<br><span class="ss">Card, bank transfer or USSD. Paid straight to the seller.</span></button><button class="lrow'+(CKM==='offline'?' picked':'')+'" data-pm="offline">🤝 Pay on delivery<br><span class="ss">Cash or POS when you meet on campus.</span></button>')
   +'<button class="btn" data-ckgo="1">'+(free?'Confirm reservation':(CKM==='paystack'?'Pay securely with Paystack':'Place order (pay on delivery)'))+'</button>');
}
async function ckGo(btn){
  if(btn.disabled||!CK)return;btn.disabled=true;const lab=btn.textContent;btn.textContent='Please wait…';
  try{
    const online=CKM==='paystack'&&CK.p>0;
    let ins=await sb.from('orders').insert({listing_id:CK.id,listing_title:CK.t,seller_id:CK.s,buyer_id:ME.id,amount_kobo:CK.p*CKQ*100,quantity:CKQ,method:online?'paystack':'offline'}).select('id').single();
    if(ins.error){
      if(ins.error.code==='23505'){
        const ex=await sb.from('orders').select('id,payment_status').eq('listing_id',CK.id).eq('buyer_id',ME.id).order('created_at',{ascending:false}).limit(1).maybeSingle();
        if(online&&ex.data&&ex.data.payment_status!=='paid')ins={data:{id:ex.data.id}};
        else throw new Error('You already have a pending order for this item.');
      }else throw ins.error;
    }
    let paid=false;
    if(online){paid=await payOnline(ins.data.id);if(!paid){toast('Payment not completed. Your order is saved. Tap Pay to try again.');btn.disabled=false;btn.textContent=lab;return;}}
    let cid=null;
    try{
      cid=await getConv(CK.id,CK.t,CK.s);
      await sb.from('messages').insert({conversation_id:cid,sender_id:ME.id,body:"Hi! I'd like to order "+(CKQ>1?CKQ+' x ':'')+'"'+CK.t+'" ('+(CK.p?nmoney(CK.p*CKQ):'free')+'). '+(paid?'Paid online via Paystack. ':'Payment: pay on delivery. ')+'When can we meet?'});
    }catch(e){}
    openA('<div style="text-align:center;padding:8px 0"><div style="font-size:42px">✅</div><h3>'+(paid?'Payment verified!':'Order sent!')+'</h3><p class="ss" style="margin:6px 0 14px">'+(paid?'Paystack confirmed your payment. ':'')+'Chat with the seller to agree a meetup. Your handover code is in My Shop › Orders.</p>'+(cid?'<button class="btn" data-ckchat="'+esc(cid)+'">Open chat</button>':'')+'<button class="obtn ghost" data-ckord="1" style="width:100%;margin-top:8px">View my orders</button></div>');
    CK=null;
  }catch(e){toast(e.message||'Could not place order, try again.');btn.disabled=false;btn.textContent=lab;}
}
function openOffer(b){
  if(!ME){toast('Sign in to make an offer.');return;}
  const d=b.dataset;if(d.s===ME.id){toast("That's your own listing.");return;}
  OF={id:d.id,s:d.s,t:d.t,p:+d.p||0};
  openA('<h3 style="margin-bottom:10px">Make an offer</h3><div class="ord-box"><b>'+esc(OF.t)+'</b><br><span class="ss">Asking price: '+nmoney(OF.p)+'</span></div><input id="ofAmt" inputmode="numeric" autocomplete="off" placeholder="Your offer in ₦" style="margin-top:10px"><div class="mtabs" style="margin-bottom:8px"><button data-pct="10">10% off</button><button data-pct="20">20% off</button><button data-pct="30">30% off</button></div><input id="ofNote" maxlength="120" autocomplete="off" placeholder="Message (optional)"><p class="ss" id="ofHint" style="min-height:18px;margin-bottom:8px"></p><button class="btn" data-ofgo="1">Send offer →</button>');
}
const ofVal=()=>parseInt(($('ofAmt').value||'').replace(/\D/g,''),10)||0;
function ofHint(){const a=ofVal(),h=$('ofHint');if(!h||!OF)return;h.textContent=!a||!OF.p?'':a>=OF.p?'This is at or above the asking price.':a<OF.p*0.4?'This is far below the asking price. Sellers may ignore very low offers.':'';}
document.addEventListener('input',e=>{
  if(e.target.id!=='ofAmt')return;
  const el=e.target,keep=el.value.slice(0,el.selectionStart).replace(/\D/g,'').length,f=commaNum(el.value);
  el.value=f;let n=0,i=0;for(;i<f.length&&n<keep;i++)if(/\d/.test(f[i]))n++;
  try{el.setSelectionRange(i,i);}catch(x){}ofHint();
});
async function ofGo(btn){
  const amt=ofVal();if(!OF)return;
  if(!amt){toast('Enter the amount you want to offer.');return;}
  if(btn.disabled)return;btn.disabled=true;
  try{
    const note=($('ofNote').value||'').trim(),cid=await getConv(OF.id,OF.t,OF.s);
    const {error}=await sb.from('messages').insert({conversation_id:cid,sender_id:ME.id,body:'Hi! Would you take '+nmoney(amt)+' for "'+OF.t+'"?'+(note?' '+note:'')});
    if(error)throw new Error('Could not send offer: '+error.message);
    closeA();OF=null;toast('Offer sent. Continue in chat.');location.hash='#chat='+cid;
  }catch(e){toast(e.message);btn.disabled=false;}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-buy],[data-offer],[data-pm],[data-q],[data-ckgo],[data-ckchat],[data-ckord],[data-pct],[data-ofgo]');if(!t)return;
  const d=t.dataset;
  if('buy' in d)return openCheckout(t);
  if('offer' in d)return openOffer(t);
  if('pm' in d){CKM=d.pm;return paintCk();}
  if('q' in d){CKQ=Math.min(20,Math.max(1,CKQ+(+d.q)));return paintCk();}
  if('ckgo' in d)return ckGo(t);
  if('ckchat' in d){closeA();location.hash='#chat='+d.ckchat;return;}
  if('ckord' in d){closeA();location.hash='#orders';return;}
  if('pct' in d){if(!OF)return;$('ofAmt').value=commaNum(String(Math.max(50,Math.round(OF.p*(1-d.pct/100)/50)*50)));ofHint();return;}
  if('ofgo' in d)return ofGo(t);
});
