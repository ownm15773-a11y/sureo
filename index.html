<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7f5;--card:#fff;--ink:#1c2b27;--mute:#6b7d77;--line:#e3eae7;--soft:#e8f4ef;--brand:#0d4a3a;--bt:#0d4a3a;--accent:#ff6b35;--wa:#25d366;--wbg:#fff1e6;--wfg:#9a4a12;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1614;--card:#16211e;--ink:#e6efec;--mute:#93a69f;--line:#25332f;--soft:#1a2c26;--bt:#6fd3b0;--wbg:#33241a;--wfg:#ffb98a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1614;--card:#16211e;--ink:#e6efec;--mute:#93a69f;--line:#25332f;--soft:#1a2c26;--bt:#6fd3b0;--wbg:#33241a;--wfg:#ffb98a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
#root{height:100%}
.app{max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg)}
header{background:var(--brand);color:#fff;padding:12px 16px 14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.logo{background:#fff;color:#0d4a3a;font-weight:900;font-size:20px;padding:2px 10px;border-radius:9px;letter-spacing:-.5px}
.logo i{color:var(--accent);font-style:normal;font-size:12px;vertical-align:super}
.ib{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;position:relative;font-size:17px;margin-left:8px}
.dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.sw{position:relative}
.sb{width:100%;border:0;border-radius:99px;padding:10px 38px 10px 16px;background:#fff;color:#1c2b27;outline:0}
.sb:focus{box-shadow:0 0 0 2px var(--accent)}
.clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;color:#6b7d77;font-size:16px}
main{flex:1;overflow-y:auto}
.pad{padding:14px 16px}
.ban{background:var(--soft);color:var(--bt);padding:9px 16px;font-size:12px;font-weight:600}
.flash{margin:14px 16px 0;background:linear-gradient(120deg,#ff6b35,#e9520f);color:#fff;border-radius:16px;padding:14px;display:flex;justify-content:space-between;gap:10px}
.flash h2{margin:2px 0;font-size:17px;line-height:1.2}
.flash small{opacity:.92}
.cd{background:rgba(255,255,255,.22);border-radius:8px;padding:3px 9px;font:700 12px ui-monospace,monospace;display:inline-block;margin-bottom:8px}
.gb{background:#fff;color:#e9520f;font-weight:800;font-size:12px;border-radius:9px;padding:7px 11px}
.seg{margin:16px 16px 0;background:var(--line);border-radius:14px;padding:4px;display:flex;position:relative}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:700;font-size:13px;color:var(--mute);position:relative;z-index:1;transition:color .25s}
.seg .on{background:var(--brand);color:#fff}
.seg.s .on{background:none}
.ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--brand);border-radius:11px;transition:transform .32s cubic-bezier(.4,0,.2,1)}
.fx{animation:fx .3s ease-out}
@keyframes fx{from{opacity:0;transform:translateY(8px)}}
.grid{min-height:560px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:6px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--mute);transition:background .25s,color .25s,border-color .25s,transform .15s}
.pill:active{transform:scale(.94)}
.pill.on{background:var(--brand);border-color:var(--brand);color:#fff}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0;font-size:12px;color:var(--mute)}
.bar select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 16px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;animation:fx .35s ease-out both}
.pic{height:116px;background:var(--soft);display:flex;align-items:center;justify-content:center;position:relative}
.pic img{width:100%;height:100%;object-fit:cover}
.em{font-size:48px}
.tag{position:absolute;top:8px;left:8px;background:rgba(15,25,22,.74);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px}
.vb{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:#aab8b3;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.vb.on{background:#16a373}
.hrt{position:absolute;bottom:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.93);color:#8a9a94;font-size:15px}
.hrt.on{color:#f43f5e}
.inf{padding:10px 10px 8px;flex:1;display:flex;flex-direction:column;gap:2px}
.ttl{font-size:12.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.inf small,.mute{color:var(--mute);font-size:12px}
.pr{margin-top:auto;padding-top:6px;font-weight:900;color:var(--bt);font-size:15px}
.wa{background:var(--wa);color:#fff;font-weight:700;font-size:12px;padding:9px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.box h3,.sh h3{margin:0 0 8px;font-size:15px}
.row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;width:100%;text-align:left}
.row:hover{background:var(--soft)}
.row .r{flex:1;min-width:0}
.row b{display:block;font-size:13px}
.hero{background:var(--brand);color:#fff;border-radius:16px;padding:18px;margin-bottom:12px}
.hero h2{margin:0 0 4px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:19px;color:var(--bt)}
.stat small{color:var(--mute);font-size:11px}
nav{display:flex;justify-content:space-around;align-items:center;background:var(--card);border-top:1px solid var(--line);padding:6px 8px}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:4px 10px}
nav button span{font-size:19px}
nav .on{color:var(--bt);font-weight:700}
nav .plus{width:50px;height:50px;border-radius:50%;background:var(--brand);color:var(--accent);font-size:28px;padding:0;margin-top:-20px;border:4px solid var(--bg);align-items:center;justify-content:center}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:20;animation:fade .2s}
.sh{background:var(--card);width:100%;max-height:90%;overflow-y:auto;overscroll-behavior:contain;border-radius:26px 26px 0 0;padding:8px 20px 24px;animation:up .25s ease-out}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.btn{background:var(--brand);color:#fff;font-weight:800;border-radius:12px;padding:12px 16px;text-align:center;display:block;text-decoration:none;width:100%}
.btn.g{background:var(--wa)}
.btn.l{background:var(--line);color:var(--ink)}
.two{display:flex;gap:10px;margin-top:16px}
.in{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;outline:0;margin-top:4px}
.in:focus{border-color:var(--brand)}
label{display:block;font-weight:700;font-size:12px;margin-top:12px}
.note{background:var(--soft);color:var(--bt);border-radius:12px;padding:10px 12px;font-size:12px;margin-top:12px}
.note.w{background:var(--wbg);color:var(--wfg)}
.toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#111c19;color:#fff;font-weight:700;font-size:12px;padding:10px 16px;border-radius:99px;z-index:30;max-width:90%;text-align:center;animation:fade .2s}
.empty{grid-column:1/-1;text-align:center;padding:36px 16px;color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.chips button{font-size:24px;padding:6px 8px;border-radius:12px;border:1px solid var(--line)}
.chips .on{background:var(--soft);border-color:var(--brand)}
.up{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line);border-radius:12px;padding:14px;margin-top:4px;color:var(--mute);gap:10px;cursor:pointer}
.up img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.big{width:96px;height:96px;border-radius:18px;background:var(--soft);margin:6px auto 10px;display:flex;align-items:center;justify-content:center;font-size:58px;overflow:hidden}
.big img{width:100%;height:100%;object-fit:cover}
.c{text-align:center}
.sold{position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;letter-spacing:.5px}
.card.is{opacity:.8}
.cartbar{margin:0 12px 8px;background:var(--brand);color:#fff;border-radius:14px;padding:11px 14px;display:flex;justify-content:space-between;font-weight:700;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:fx .3s}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:28px;height:28px;border-radius:50%;background:var(--line);font-weight:800}
.stars{display:flex;gap:6px;justify-content:center;font-size:34px;margin:10px 0}
.stars button{color:#c4cfca;transition:color .15s,transform .15s}
.stars .on{color:#f5b301;transform:scale(1.1)}
.chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);font-size:12px;font-weight:600;margin:4px 6px 0 0;transition:background .25s,color .25s}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.steps{display:flex;gap:4px;margin-top:8px}
.steps i{flex:1;height:4px;border-radius:9px;background:var(--line);transition:background .4s}
.steps i.on{background:var(--wa)}
.lnk{color:var(--mute);font-size:12px;text-decoration:underline;margin-top:12px;display:block;width:100%;text-align:center}
.mini{font-size:11px;font-weight:700;padding:5px 10px;border-radius:9px;background:var(--soft);color:var(--bt)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.land{height:100%;overflow-y:auto;background:var(--bg)}
.lh{display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:0 auto;padding:16px 20px}
.lh .logo{background:var(--brand);color:#fff}
.lbtn{background:var(--accent);color:#fff;font-weight:800;border-radius:12px;padding:10px 18px}
.lbtn.big{padding:14px 26px;font-size:16px}
.lhero{background:var(--brand);color:#fff;padding:56px 20px 72px;text-align:center}
.lhero h1{max-width:760px;margin:0 auto 14px;font-size:clamp(30px,6vw,52px);line-height:1.1;letter-spacing:-1px}
.lhero p{max-width:560px;margin:0 auto 26px;font-size:16px;line-height:1.5;opacity:.92}
.lgrid{max-width:1000px;margin:-32px auto 0;padding:0 20px 36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;position:relative}
.lc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
.lc span{font-size:28px}
.lc b{display:block;margin:6px 0 2px;font-size:16px}
.lf{text-align:center;color:var(--mute);font-size:12px;padding:0 20px 32px}
@media (min-width:900px){
.app{max-width:1120px;display:grid;grid-template-columns:220px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;box-shadow:0 0 0 1px var(--line)}
header{grid-column:1/-1}
main{grid-column:2;grid-row:2}
.cartbar{grid-column:2;grid-row:3;margin:8px 16px}
nav{grid-column:1;grid-row:2/4;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:4px;border-top:0;border-right:1px solid var(--line);padding:16px 10px}
nav button{flex-direction:row;gap:10px;font-size:14px;padding:11px 12px;border-radius:12px;justify-content:flex-start}
nav button:hover{background:var(--soft)}
nav .plus{order:-1;width:auto;height:auto;margin:0 0 10px;border:0;font-size:20px;background:var(--brand);color:#fff}
nav .plus::after{content:'Sell an item';font-size:14px;font-weight:700}
.grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.pad{max-width:720px;margin:0 auto;width:100%}
.sw{max-width:520px}
.sh{max-width:520px;margin:0 auto;border-radius:26px}
.ov{align-items:center}
}
</style>

function Sheet({onClose,children}){

  const move=e=>{if(t0.current==null)return;const d=e.touches[0].clientY-t0.current;if(d>0){setDrag(true);setDy(d)}else{setDy(0);setDrag(false);t0.current=null}};

      {!chats.length&&<p className="mute">No chats yet. Tap “Chat on WhatsApp” on any listing.</p>}
    </div></div>}

    {tab==='vendor'&&<div className="pad"><button className="mini" onClick={()=>setTab('profile')}>‹ Profile</button>
    <div className="hero" style={{marginTop:10}}><h2>Vendor dashboard</h2><div style={{fontSize:12,opacity:.9}}>Demo: pick which shop you’re running.</div><select className="in" style={{color:'#1c2b27',background:'#fff'}} value={shop} onChange={e=>setShop(e.target.value)} aria-label="Shop">{vendors.map(v=><option key={v}>{v}</option>)}</select><button className="gb" style={{marginTop:12}} onClick={()=>setClosed(c=>({...c,[shop]:!c[shop]}))}>{closed[shop]?'Closed · Tap to open':'Open · Tap to close'}</button></div>
    <div className="stats"><div className="stat"><b>{shopOrders.filter(o=>o.step===0&&!o.declined).length}</b><small>New</small></div><div className="stat"><b>{shopOrders.filter(o=>o.step>0&&o.step<3).length}</b><small>In progress</small></div><div className="stat"><b>{fmt(shopOrders.filter(o=>o.step===3).reduce((s,o)=>s+o.total,0))}</b><small>Earned</small></div></div>
    <div className="box"><h3>Orders</h3>{shopOrders.map(o=><div key={o.id} style={{marginBottom:14}}><b>{o.items.map(x=>x.n+'× '+x.title).join(', ')}</b><div className="mute">{fmt(o.total)} · Deliver to {o.to}</div><div style={{display:'flex',gap:8,marginTop:6}}>{o.declined?<span className="mute">Declined</span>:o.step===0?<><button className="mini" onClick={()=>advance(o,1)}>Accept</button><button className="mini" onClick={()=>decline(o)}>Decline</button></>:o.step===1?<button className="mini" onClick={()=>advance(o,2)}>Out for delivery</button>:o.step===2?<button className="mini" onClick={()=>advance(o,3)}>Mark delivered</button>:<span className="mute">Delivered ✓</span>}</div></div>)}{!shopOrders.length&&<p className="mute">No orders yet. Place one from Home, then come back here to accept it.</p>}</div>
    <div className="box"><h3>Menu</h3>{eats.filter(i=>i.vendor===shop).map(it=><div key={it.id} className="row" style={{cursor:'default'}}><span style={{fontSize:26}}>{it.emoji}</span><span className="r"><b>{it.title}</b><span className="mute">{fmt(it.price)}{it.sold?' · Sold out':''}</span></span><button className="mini" onClick={()=>toggleSold(it)}>{it.sold?'Back in stock':'Sold out'}</button></div>)}</div></div>}

    {tab==='profile'&&<div className="pad">
      <div className="hero c"><div style={{fontSize:40}}>👤</div><h2>Chinedu Okafor</h2><span style={{fontSize:12,opacity:.9}}>Computer Science, 300 Level, Hostel A (demo account)</span></div>
      <div className="stats"><div className="stat"><b>{mine.length}</b><small>My listings</small></div><div className="stat"><b>{wish.length}</b><small>Saved</small></div><div className="stat"><b>{chats.length}</b><small>Chats</small></div></div>
      <div className="box"><h3>Saved items</h3>
        {all.filter(i=>wish.includes(i.id)).map(it=><button key={it.id} className="row" onClick={()=>setActive(it)}><span style={{fontSize:26}}>{it.emoji}</span><span className="r"><b>{it.title}</b><span className="mute">{fmt(it.price)}</span></span></button>)}
        {!wish.length&&<p className="mute">Tap ♡ on a listing to save it here.</p>}
      </div>
      <div className="box"><button className="row" onClick={()=>setVOpen(true)}><span className="r"><b>Student ID verification</b><span className="mute">{verif==='verified'?'Verified ✓':verif==='pending'?'Pending review':'Not verified'}</span></span><span className="mute">›</span></button><button className="row" onClick={()=>setTab('vendor')}><span className="r"><b>Vendor dashboard</b><span className="mute">Orders, menu and open hours</span></span><span className="mute">›</span></button><button className="row" onClick={()=>setMineOpen(true)}><span className="r"><b>My listings</b><span className="mute">{mine.length} listed</span></span><span className="mute">›</span></button><button className="row" onClick={()=>setSafeOpen(true)}><span className="r"><b>Safety guide</b><span className="mute">Tips to avoid scams</span></span><span className="mute">›</span></button><button className="row" onClick={()=>setBlkOpen(true)}><span className="r"><b>Blocked sellers</b><span className="mute">{blocked.length} blocked</span></span><span className="mute">›</span></button><button className="row" onClick={()=>setLanding(true)}><span className="r"><b>About Sureo</b><span className="mute">What it is and how it works</span></span><span className="mute">›</span></button>{['Notification settings'].map(l=><button key={l} className="row" onClick={()=>soon(l)}><span className="r"><b>{l}</b></span><span className="mute">›</span></button>)}</div>
    </div>}
    </main>

    {count>0&&<button className="cartbar" onClick={()=>setCartOpen(true)}><span>🛒 View order · {count} {count===1?'item':'items'}</span><span>{fmt(sub)}</span></button>}<nav><Nav id="home" icon="🏠" label="Home"/><Nav id="explore" icon="🧭" label="Explore"/><button className="plus" aria-label="Sell an item" onClick={()=>setSell(true)}>+</button><Nav id="chats" icon="💬" label="Chats"/><Nav id="profile" icon="👤" label="Profile"/></nav>

    {active&&<Sheet onClose={()=>setActive(null)}>
      <div className="big">{active.img?<img src={active.img} alt=""/>:active.emoji}</div>
      <div className="c"><span className="mute">{active.category}{active.verified?' · ✓ Verified seller':' · Not verified yet'}</span>
        <h3 style={{fontSize:18,margin:'6px 0 2px'}}>{active.title}</h3>
        <div className="mute">{active.vendor} · {active.reviews?'★ '+active.rating+' ('+active.reviews+')':'New seller'}</div>
        <div style={{fontSize:24,fontWeight:900,color:'var(--bt)',margin:'8px 0'}}>{fmt(active.price)}</div></div>
      <div className="note" style={{background:'var(--bg)',color:'var(--ink)'}}>{active.desc}<div className="mute" style={{marginTop:8}}>📍 {active.location} · ⏱ {active.time}</div></div>
      {!active.verified&&<div className="note w">This seller isn’t verified yet. Meet in a public campus spot and pay after you’ve checked the item.</div>}
      {active.sold&&<div className="note w">This item has been sold.</div>}{closed[active.vendor]&&<div className="note w">{active.vendor} is closed right now.</div>}
      <div className="two"><button className="btn l" style={{width:52,padding:0}} aria-label="Save" onClick={()=>toggleWish(active.id)}>{wish.includes(active.id)?'♥':'♡'}</button><button className="btn l" style={{width:52,padding:0}} aria-label="Share" onClick={()=>share(active)}>↗</button>{isEats&&!active.sold&&!closed[active.vendor]&&<button className="btn" onClick={()=>{addCart(active);setActive(null)}}>Add to order</button>}<button className="btn g" disabled={active.sold} onClick={()=>{const it=active;setActive(null);openChat(it)}}>Chat on WhatsApp</button></div>
      {active.vendor==='You'&&<><button className="btn l" style={{marginTop:10}} onClick={()=>{setEdit({...active});setActive(null)}}>Edit listing</button><button className="btn l" style={{marginTop:10}} onClick={()=>toggleSold(active)}>{active.sold?'Mark as available':'Mark as sold'}</button></>}
      {done.includes(active.id)&&!rated.includes(active.id)&&<button className="btn l" style={{marginTop:10}} onClick={()=>{const it=active;setActive(null);askRate(it)}}>Rate this seller</button>}
      {active.vendor!=='You'&&<div style={{display:'flex',justifyContent:'center',gap:18}}><button className="lnk" style={{width:'auto'}} onClick={()=>{setReport(active);setActive(null)}}>Report this listing</button><button className="lnk" style={{width:'auto'}} onClick={()=>blockSeller(active.vendor)}>Block seller</button></div>}
    </Sheet>}

    {chat&&<Sheet onClose={()=>setChat(null)}>
      <h3>Message {chat.vendor}</h3><div className="mute">{chat.title} · {fmt(chat.price)}</div>
      <label>Your message</label><textarea className="in" rows={3} value={msg} onChange={e=>setMsg(e.target.value)}/>
      <a className="btn g" style={{marginTop:14}} href={waLink(chat,msg)} target="_blank" rel="noopener noreferrer">Open WhatsApp</a>
      {!chat.phone&&<div className="note">This demo listing has no seller number, so WhatsApp will let you pick a contact for the message.</div>}
      <div className="note w">Meet in a public campus spot and pay only after you’ve checked the item. <button className="mini" style={{marginLeft:6}} onClick={()=>{setChat(null);setSafeOpen(true)}}>Safety tips</button></div>
    </Sheet>}

    {notif&&<Sheet onClose={()=>setNotif(false)}><h3>Notifications</h3>{NOTES.map(([t,d,w,u])=><div key={t} className="note" style={u?{}:{background:'var(--bg)',color:'var(--ink)'}}><b>{t}</b> <span className="mute">{w}</span><div>{d}</div></div>)}</Sheet>}

    {sell&&<Sheet onClose={closeSell}>
      <h3>List an item <span className="mute" style={{fontWeight:400}}>Step {step} of 2</span></h3>
      <form onSubmit={publish}>
      {step===1?<>
        <div className="seg" style={{margin:'4px 0 0'}}>{[['eats','🍴 Campus Eats'],['market','🛍️ Student Market']].map(([s,l])=><button type="button" key={s} className={form.section===s?'on':''} onClick={()=>setForm(f=>({...f,section:s,category:CATS[s][0][0],emoji:CATS[s][0][1]}))}>{l}</button>)}</div>
        <label>Title</label><input className="in" required value={form.title} onChange={setF('title')} placeholder={form.section==='eats'?'Fried rice and turkey':'Scientific calculator'}/>
        <label>Price (₦)</label><input className="in" type="number" min="0" required value={form.price} onChange={setF('price')} placeholder="2000"/>
        <label>Category</label><select className="in" value={form.category} onChange={setF('category')}>{CATS[form.section].map(([c])=><option key={c}>{c}</option>)}</select>
        <label>Photo</label><label className="up" style={{fontWeight:400,fontSize:13}}>{form.img?<img src={form.img} alt="Preview"/>:'📷'}<span>{form.img?'Change photo':'Add a photo'}</span><input type="file" accept="image/*" hidden onChange={e=>pickPhoto(e.target.files[0])}/></label>
        {!form.img&&<><label>Or pick an icon</label><div className="chips">{EMOJI.map(m=><button type="button" key={m} className={form.emoji===m?'on':''} onClick={()=>setForm(f=>({...f,emoji:m}))}>{m}</button>)}</div></>}
        <button type="button" className="btn" style={{marginTop:16}} onClick={()=>{if(!form.title.trim()||!form.price)return setToast('Add a title and price');setStep(2)}}>Next: contact and location</button>
      </>:<>
        <label>WhatsApp number</label><input className="in" type="tel" required value={form.phone} onChange={setF('phone')} placeholder="0803 000 0000"/>
        <label>Pickup spot or hostel</label><input className="in" value={form.location} onChange={setF('location')} placeholder="Hostel A, Room 12"/>
        <label>Description</label><textarea className="in" rows={3} value={form.desc} onChange={setF('desc')} placeholder="Condition, delivery terms or pickup times"/>
        <div className="note">New listings show a “not verified” mark until your student ID is checked.</div>
        <div className="two"><button type="button" className="btn l" style={{width:'33%'}} onClick={()=>setStep(1)}>Back</button><button type="submit" className="btn">Publish listing</button></div>
      </>}
      </form>
    </Sheet>}

    {vOpen&&<Sheet onClose={()=>setVOpen(false)}><h3>Student ID verification</h3>{verif==='verified'?<div className="note">You’re verified. Your listings show the ✓ badge.</div>:verif==='pending'?<><div className="note">Your ID is under review, usually within a day.</div><button className="btn l" style={{marginTop:14}} onClick={approve}>Approve now (prototype only)</button></>:<form onSubmit={submitVerify}><p className="mute">Add your matric number and a photo of your student ID. It’s only used to confirm you’re a current student.</p><label>Matric number</label><input className="in" required value={matric} onChange={e=>setMatric(e.target.value)} placeholder="Matric number"/><label>Student ID photo</label><label className="up" style={{fontWeight:400,fontSize:13}}>📷 <span>{idImg||'Choose a photo'}</span><input type="file" accept="image/*" hidden onChange={e=>setIdImg(e.target.files[0]?e.target.files[0].name:'')}/></label><button type="submit" className="btn" style={{marginTop:16}}>Submit for review</button></form>}</Sheet>}
    {cartOpen&&<Sheet onClose={()=>setCartOpen(false)}><h3>Your order{cartItems[0]?' from '+cartItems[0].it.vendor:''}</h3>{cartItems.map(({it,n})=><div key={it.id} className="row" style={{cursor:'default'}}><span style={{fontSize:26}}>{it.emoji}</span><span className="r"><b>{it.title}</b><span className="mute">{fmt(it.price*n)}</span></span><span className="qty"><button onClick={()=>setQty(it.id,-1)} aria-label="Remove one">−</button>{n}<button onClick={()=>setQty(it.id,1)} aria-label="Add one">+</button></span></div>)}{!count&&<p className="mute">Your order is empty.</p>}{count>0&&<><label>Deliver to</label><input className="in" value={dropoff} onChange={e=>setDropoff(e.target.value)}/><div className="note">Items {fmt(sub)} · Delivery {fmt(FEE)}<br/><b>Total {fmt(sub+FEE)}</b>. Pay the vendor on delivery.</div><button className="btn" style={{marginTop:14}} onClick={placeOrder}>Place order</button></>}</Sheet>}
    {rate&&<Sheet onClose={()=>setRate(null)}><h3>Rate {rate.vendor}</h3><div className="mute">{rate.title}</div><div className="stars">{[1,2,3,4,5].map(n=><button key={n} className={stars>=n?'on':''} aria-label={n+' stars'} onClick={()=>setStars(n)}>★</button>)}</div><button className="btn" onClick={submitRate}>Submit rating</button><div className="mute c" style={{marginTop:10}}>You can rate a seller once, after a completed deal.</div></Sheet>}
    {report&&<Sheet onClose={()=>setReport(null)}><h3>Report this listing</h3><div className="mute">{report.title}</div>{['Looks like a scam','Item not as described','Wrong price','Abusive seller','Prohibited item'].map(r=><button key={r} className="row" onClick={()=>sendReport(r)}><span className="r"><b>{r}</b></span><span className="mute">›</span></button>)}</Sheet>}
    {mineOpen&&<Sheet onClose={()=>setMineOpen(false)}><h3>My listings</h3>{mine.map(it=><div key={it.id} className="row" style={{cursor:'default'}}><span style={{fontSize:26}}>{it.img?<img src={it.img} alt="" style={{width:36,height:36,borderRadius:8,objectFit:'cover'}}/>:it.emoji}</span><span className="r"><b>{it.title}</b><span className="mute">{fmt(it.price)}{it.sold?' · Sold':''}</span></span><button className="mini" style={{marginRight:6}} onClick={()=>{setEdit({...it});setMineOpen(false)}}>Edit</button><button className="mini" onClick={()=>toggleSold(it)}>{it.sold?'Relist':'Mark sold'}</button></div>)}{!mine.length&&<p className="mute">You haven’t listed anything yet. Tap + to start.</p>}</Sheet>}
    {fOpen&&<Sheet onClose={()=>setFOpen(false)}><h3>Filters</h3><label>Price range (₦)</label><div style={{display:'flex',gap:8}}><input className="in" type="number" min="0" placeholder="Min" value={flt.min} onChange={e=>setFlt(f=>({...f,min:e.target.value}))}/><input className="in" type="number" min="0" placeholder="Max" value={flt.max} onChange={e=>setFlt(f=>({...f,max:e.target.value}))}/></div><div style={{marginTop:6}}>{[['Under ₦1,000',1000],['Under ₦5,000',5000],['Under ₦20,000',20000]].map(([l,b])=><button key={l} className="chip" onClick={()=>setFlt(f=>({...f,min:'',max:String(b)}))}>{l}</button>)}</div><label>Walking distance from Hostel A</label><div>{[[0,'Any'],[5,'5 min'],[10,'10 min'],[15,'15 min']].map(([m,l])=><button key={m} className={'chip'+(flt.walk===m?' on':'')} onClick={()=>setFlt(f=>({...f,walk:m}))}>{l}</button>)}</div><div className="two"><button className="btn l" style={{width:'40%'}} onClick={()=>setFlt({min:'',max:'',walk:0})}>Reset</button><button className="btn" onClick={()=>setFOpen(false)}>Show {list.length} items</button></div></Sheet>}
    {edit&&<Sheet onClose={()=>setEdit(null)}><h3>Edit listing</h3><form onSubmit={saveEdit}><label>Title</label><input className="in" required value={edit.title} onChange={ed('title')}/><label>Price (₦)</label><input className="in" type="number" min="0" required value={edit.price} onChange={ed('price')}/><label>Photo</label><label className="up" style={{fontWeight:400,fontSize:13}}>{edit.img?<img src={edit.img} alt="Preview"/>:'📷'}<span>{edit.img?'Change photo':'Add a photo'}</span><input type="file" accept="image/*" hidden onChange={e=>pickPhoto(e.target.files[0],setEdit)}/></label><label>WhatsApp number</label><input className="in" type="tel" value={edit.phone||''} onChange={ed('phone')}/><label>Pickup spot</label><input className="in" value={edit.location} onChange={ed('location')}/><label>Description</label><textarea className="in" rows={3} value={edit.desc} onChange={ed('desc')}/><button type="submit" className="btn" style={{marginTop:16}}>Save changes</button></form></Sheet>}
    {wOpen&&<Sheet onClose={()=>setWOpen(false)}><h3>Post a request</h3><form onSubmit={postWant}><label>What do you need?</label><input className="in" required value={wf.title} onChange={wfs('title')} placeholder="Used scientific calculator"/><label>Your budget (₦)</label><input className="in" type="number" min="0" required value={wf.budget} onChange={wfs('budget')} placeholder="4000"/><label>Details (optional)</label><input className="in" value={wf.note} onChange={wfs('note')} placeholder="Condition, deadline, pickup spot"/><label>WhatsApp number</label><input className="in" type="tel" required value={wf.phone} onChange={wfs('phone')} placeholder="0803 000 0000"/><button type="submit" className="btn" style={{marginTop:16}}>Post request</button></form></Sheet>}
    {safeOpen&&<Sheet onClose={()=>setSafeOpen(false)}><h3>Safety guide</h3>{[['📍','Meet in a busy campus spot','The SUB, the library or a bukateria, in daylight. Don’t go to a stranger’s room alone.'],['🔍','Check before you pay','Switch on phones and laptops, test calculators, flip through textbooks.'],['✅','Look for the ✓','Verified sellers have shown a student ID. Take extra care with unverified ones.'],['💵','Pay on delivery','Avoid sending money first, including “booking fees” or “delivery deposits”.'],['👥','Bring a friend','Especially for anything over ₦20,000, like a laptop or phone.'],['🚩','Watch for red flags','A price that’s too good, pressure to hurry, or a seller who won’t meet in person.']].map(([e,t,d])=><div key={t} className="row" style={{cursor:'default',alignItems:'flex-start'}}><span style={{fontSize:22}}>{e}</span><span className="r"><b>{t}</b><span className="mute">{d}</span></span></div>)}<div className="note">Something feels off? Report the listing and block the seller.</div></Sheet>}
    {blkOpen&&<Sheet onClose={()=>setBlkOpen(false)}><h3>Blocked sellers</h3>{blocked.map(v=><div key={v} className="row" style={{cursor:'default'}}><span className="r"><b>{v}</b></span><button className="mini" onClick={()=>setBlocked(b=>b.filter(x=>x!==v))}>Unblock</button></div>)}{!blocked.length&&<p className="mute">No one is blocked. You can block a seller from their listing.</p>}</Sheet>}
    {toast&&<div className="toast" role="status">{toast}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
