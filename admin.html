<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sureo Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--p:#0d4a3a;--bg:#f8f9fa;--t:#111827;--m:#6b7280;--b:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--t);line-height:1.5;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
.w{max-width:640px;margin:0 auto}
h1{font-size:22px;font-weight:800;margin-bottom:2px}
.sub{color:var(--m);font-size:13.5px;margin-bottom:18px}
h2{font-size:15px;font-weight:800;margin:24px 0 10px}
.card{background:#fff;border:1.5px solid var(--b);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.nm{font-weight:800;font-size:15px}
.mt{font-size:12.5px;color:var(--m);margin:3px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,input{font:inherit}
button{padding:10px 14px;border-radius:10px;font-size:13px;font-weight:700;border:1.5px solid var(--b);background:#fff;cursor:pointer;touch-action:manipulation}
button.ok{background:var(--p);color:#fff;border-color:var(--p)}
button.no{color:#b91c1c;border-color:#fecaca}
button:disabled{opacity:.5}
input{width:100%;padding:13px 14px;border:1.5px solid var(--b);border-radius:12px;margin-bottom:10px;font-size:16px}
.err{color:#b91c1c;font-size:13px;margin:4px 0 10px;min-height:18px}
.em{color:var(--m);font-size:13.5px}
img.id{max-width:100%;border-radius:12px;border:1px solid var(--b);margin-bottom:10px;display:block}
#app{display:none}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;display:none;z-index:9}
</style></head><body>
<div class="w">
  <div id="login">
    <h1>🛡️ Sureo Admin</h1>
    <p class="sub">Staff only. Sign in with your admin account.</p>
    <input id="em" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <div class="err" id="lerr"></div>
    <button class="ok" id="go" style="width:100%;padding:14px">Sign in</button>
  </div>
  <div id="app">
    <div class="top"><div><h1>🛡️ Sureo Admin</h1><p class="sub" id="who"></p></div><button id="out">Sign out</button></div>
    <h2>Sellers waiting for approval</h2><div id="pend"><div class="em">Loading…</div></div>
    <h2>Recent users</h2><div id="usr"><div class="em">Loading…</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const sb=window.supabase.createClient('https://dgzltdkaumkprxijuoqv.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnemx0ZGthdW1rcHJ4aWp1b3F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4OTc2OTksImV4cCI6MjEwOTQ3MzY5OX0.rDMF7Dwp3QddBoXzhBFDn_QWI5k-j2o9sRAqtHmntuQ');
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.x);toast.x=setTimeout(()=>t.style.display='none',3000);}
let me=null;
async function enter(user){
  const {data}=await sb.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();
  if(!data){await sb.auth.signOut();$('lerr').textContent='This account is not an admin.';$('login').style.display='block';$('app').style.display='none';return;}
  me=user;$('login').style.display='none';$('app').style.display='block';$('who').textContent=user.email;load();
}
async function load(){
  const {data:ks,error}=await sb.from('kyc').select('user_id,matric_no,student_id_path,selfie_path,created_at,profiles(full_name)').eq('status','pending').order('created_at');
  $('pend').innerHTML=error?'<div class="em">Could not load: '+esc(error.message)+'</div>':!ks.length?'<div class="em">No one is waiting. 🎉</div>':ks.map(k=>
    '<div class="card" data-uid="'+k.user_id+'"><div class="nm">'+esc((k.profiles&&k.profiles.full_name)||'Student')+'</div>'
    +'<div class="mt">Matric: '+esc(k.matric_no||'-')+'<br>Sent '+new Date(k.created_at).toLocaleString()+'</div>'
    +'<div class="box"></div><div class="row">'+((k.student_id_path||k.selfie_path)?'<button data-act="view" data-path="'+esc(k.student_id_path||'')+'" data-selfie="'+esc(k.selfie_path||'')+'">View ID &amp; selfie</button>':'')
    +'<button class="ok" data-act="approve">Approve</button><button class="no" data-act="reject">Reject</button></div></div>').join('');
  const {data:us}=await sb.from('profiles').select('id,full_name,is_seller_verified,is_banned').order('created_at',{ascending:false}).limit(30);
  $('usr').innerHTML=us&&us.length?us.map(u=>'<div class="card" data-uid="'+u.id+'"><div class="nm">'+esc(u.full_name)+(u.is_seller_verified?' ✓':'')+(u.is_banned?' · BANNED':'')+'</div><div class="row" style="margin-top:8px">'
    +(u.is_banned?'<button data-act="unban">Unban</button>':'<button class="no" data-act="ban">Ban</button>')+'</div></div>').join(''):'<div class="em">No users yet.</div>';
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||!me)return;
  const card=b.closest('.card'),uid=card.dataset.uid,act=b.dataset.act;
  if(act==='view'){
    const show=async(path,label)=>{
      if(!path)return '<p class="mt"><b>'+label+':</b> not provided</p>';
      const {data,error}=await sb.storage.from('kyc-private').createSignedUrl(path,300);
      if(error)return '<p class="mt"><b>'+label+':</b> could not open ('+esc(error.message)+')</p>';
      return '<p class="mt"><b>'+label+'</b></p>'+(/\.pdf$/i.test(path)?'<p><a href="'+data.signedUrl+'" target="_blank" rel="noopener">Open PDF</a></p>':'<img class="id" src="'+data.signedUrl+'" alt="'+label+'">');
    };
    const html=(await show(b.dataset.path,'Student ID'))+(await show(b.dataset.selfie,'Selfie holding ID'));
    card.querySelector('.box').innerHTML=html+'<p class="mt">Check: the name, photo and matric on the ID match the selfie and the profile name.</p>';return;
  }
  if((act==='ban'||act==='reject')&&!confirm(act==='ban'?'Ban this user and remove their listings?':'Reject this seller?'))return;
  b.disabled=true;let err=null;const now=new Date().toISOString();
  if(act==='approve')err=(await sb.from('kyc').update({status:'verified',reviewed_at:now}).eq('user_id',uid)).error||(await sb.from('profiles').update({is_seller_verified:true}).eq('id',uid)).error;
  else if(act==='reject')err=(await sb.from('kyc').update({status:'rejected',reviewed_at:now}).eq('user_id',uid)).error;
  else if(act==='ban')err=(await sb.from('profiles').update({is_banned:true,is_seller_verified:false}).eq('id',uid)).error||(await sb.from('listings').update({status:'removed'}).eq('seller_id',uid)).error;
  else if(act==='unban')err=(await sb.from('profiles').update({is_banned:false}).eq('id',uid)).error;
  if(err){toast('Failed: '+err.message);b.disabled=false;return;}
  toast('✓ Done');load();
});
$('go').addEventListener('click',async()=>{
  $('lerr').textContent='';const b=$('go');b.disabled=true;
  const {data,error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  b.disabled=false;
  if(error){$('lerr').textContent=error.message==='Invalid login credentials'?'Wrong email or password.':error.message;return;}
  enter(data.user);
});
$('out').addEventListener('click',async()=>{await sb.auth.signOut();location.reload();});
sb.auth.getSession().then(({data})=>{if(data.session)enter(data.session.user);});
</script></body></html>
