<style>
:root{--bg:#f9fafb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#f1f2f4;--line2:#e5e7eb;--field:#f3f4f6;--g:#0d4a3a;--gtext:#0d4a3a;--g2:#e8f4f0;--onG:#fff;--ok:#059669;--glass:rgba(255,255,255,.9);--sh:0 1px 2px rgba(0,0,0,.05);color-scheme:light}
:root[data-theme="dark"]{--bg:#0b1210;--card:#141c19;--text:#e8efec;--muted:#9aa8a2;--line:#26332e;--line2:#2c3a35;--field:#1b2622;--g:#1f8f6d;--gtext:#5fd0ab;--g2:#143a30;--ok:#34d399;--glass:rgba(20,28,25,.92);--sh:none;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit;text-decoration:none}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 8px}
.row1{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.logo span{display:flex;align-items:center;height:36px;padding:0 12px;border-radius:10px;background:var(--g)}.logo img{display:block;height:20px;width:auto}
.camp{display:inline-flex;align-items:center;gap:4px;margin-top:6px;max-width:230px;font-size:12px;font-weight:600;color:var(--gtext)}
.camp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.camp .ic{width:14px;height:14px}
.btns{display:flex;gap:8px}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);color:var(--muted)}
.search{display:block;position:relative;margin-bottom:12px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9ca3af;width:18px;height:18px}
.search input{width:100%;padding:10px 16px 10px 40px;background:var(--field);border:2px solid transparent;border-radius:12px;outline:0;font-size:16px}
.search input:focus{border-color:var(--g);background:var(--card)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 16px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--g);border-color:var(--g);color:var(--onG);box-shadow:0 4px 8px rgba(13,74,58,.25)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
.ph{position:relative;aspect-ratio:1;background:var(--field);display:grid;place-items:center;font-size:44px;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:8px;top:8px;max-width:calc(100% - 56px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:#f3f4f6;color:#4b5563}
.tag.new{background:#dbeafe;color:#1d4ed8}.tag.like{background:#f3e8ff;color:#7e22ce}.tag.used{background:#fef3c7;color:#b45309}
.heart{position:absolute;right:8px;top:8px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--glass);color:var(--text)}
.heart .ic{width:16px;height:16px}.heart.on{color:#e0394b}.heart.on .ic{fill:#e0394b}
.cbody{padding:12px;display:flex;flex-direction:column;flex:1}
.ttl{font-size:14px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.price{font-size:16px;font-weight:700;color:var(--gtext)}
.sel{display:flex;align-items:center;gap:4px;margin-top:8px;color:var(--muted);font-size:12px;min-width:0}
.sel b{font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:80px}
.sel .ic{width:14px;height:14px;color:var(--ok);fill:var(--ok);stroke:var(--card)}
.trust{font-size:10px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--g2);color:var(--gtext)}
.sk{animation:sk 1.4s ease-in-out infinite;background:var(--line2)}
@keyframes sk{50%{opacity:.45}}
.skc{border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.skc i{display:block}
.empty{grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--muted)}
.empty h3{color:var(--text);font-size:17px;margin-bottom:6px}
.btn{display:inline-block;margin-top:14px;padding:11px 20px;border-radius:12px;background:var(--g);color:var(--onG);font-weight:700}
.more{display:block;margin:0 auto 16px;padding:11px 22px;border-radius:12px;background:var(--g2);color:var(--gtext);font-weight:700}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);box-shadow:0 -4px 20px rgba(0,0,0,.05);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:560px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;height:64px;padding:0 8px}
.nav a,.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;width:64px;height:100%;gap:4px;font-size:10px;font-weight:500;color:#9ca3af}
.nav .on{color:var(--gtext)}
.nav .on .ic{stroke-width:2.5}
.nav .ic{width:22px;height:22px}
.nav .sell i{display:grid;place-items:center;padding:8px;border-radius:50%;background:var(--g);color:var(--onG);transform:translateY(-8px);box-shadow:0 8px 16px rgba(13,74,58,.3)}
.nav .sell .ic{width:24px;height:24px;stroke:#fff}
.sheet{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;background:rgba(0,0,0,.45)}
.sheet.open{display:flex}
.panel{width:100%;max-width:560px;margin:0 auto;max-height:82vh;display:flex;flex-direction:column;background:var(--card);border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.panel h2{font-size:18px;margin-bottom:10px}
.panel input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);outline:0;font-size:16px;margin-bottom:8px}
.list{overflow-y:auto}
.list button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid var(--line)}
.list button.on{color:var(--gtext);font-weight:700}
.list small{color:var(--muted)}
.pv .top,.pv #grid,.pv #moreWrap{display:none}
#profileView{display:none;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 8px}
.pv #profileView{display:block}
.ph1{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.pav{width:64px;height:64px;border-radius:50%;background:var(--g);color:var(--onG);display:grid;place-items:center;font-size:26px;font-weight:800;flex:none}
.pname{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:700;flex-wrap:wrap}
.pname .ic{width:18px;height:18px;color:var(--ok);fill:var(--ok);stroke:var(--card)}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.pstats div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.pstats b{display:block;font-size:18px}.pstats span{font-size:12px;color:var(--muted)}
.ptl{font-size:16px;font-weight:700;margin:20px 0 10px}
.mrow{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.mrow .t{font-weight:600}.mrow .s{font-size:12px;color:var(--muted);margin:2px 0 10px}
.st{display:inline-block;padding:1px 8px;border-radius:6px;background:var(--g2);color:var(--gtext);font-size:11px;font-weight:700;text-transform:capitalize}
.st.sold,.st.expired{background:var(--field);color:var(--muted)}
.macts{display:flex;gap:8px;flex-wrap:wrap}
.macts button{padding:8px 14px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);font-size:13px;font-weight:600}
.macts .pri{background:var(--g);border-color:var(--g);color:var(--onG)}
.lrow{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:14px 12px;margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-weight:600}
.lrow small{color:var(--muted);font-weight:500}
.lrow.out{color:#dc2626}
.round.on{color:#e0394b}.round.on .ic{fill:#e0394b}
.detail{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:none;overscroll-behavior:contain}
.detail.open{display:block}
.dwrap{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.gwrap{position:relative}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:1;background:var(--field)}
.gal::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;position:relative;display:grid;place-items:center;font-size:72px}
.slide img,.slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.dbar{position:absolute;left:0;right:0;top:0;z-index:3;display:flex;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0}
.dbar .round{background:var(--glass);border-color:transparent;color:var(--text)}
.cnt{position:absolute;right:12px;bottom:12px;z-index:3;background:rgba(0,0,0,.55);color:#fff;font-size:12px;padding:3px 10px;border-radius:999px}
.dbody{padding:20px 16px;display:flex;flex-direction:column;gap:16px}
.dttl{font-size:22px;font-weight:700;line-height:1.25}
.dprice{font-size:26px;font-weight:800;color:var(--gtext);margin-top:4px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{padding:5px 10px;border-radius:8px;border:1px solid var(--line2);background:var(--card);font-size:12px;font-weight:600;color:var(--muted);text-transform:capitalize}
.fact.code{font-family:ui-monospace,monospace;text-transform:none}
.scard{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.av{width:42px;height:42px;border-radius:50%;background:var(--g2);color:var(--gtext);display:grid;place-items:center;font-weight:700;flex:none}
.sn{display:flex;align-items:center;gap:6px;font-weight:600}
.sn .ic{width:15px;height:15px;color:var(--ok);fill:var(--ok);stroke:var(--card)}
.ss{font-size:12px;color:var(--muted)}
.safe{background:var(--g2);color:var(--gtext);border-radius:12px;padding:12px;font-size:13px;line-height:1.45}
.dact{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.dact div{max-width:560px;margin:0 auto;display:flex;gap:10px}
.buy{flex:1;text-align:center;background:var(--g);color:var(--onG);font-weight:700;padding:14px;border-radius:12px}
.alt{padding:14px 18px;border-radius:12px;background:var(--field);border:1px solid var(--line2);font-weight:600}
.wa{width:50px;flex:none;border-radius:12px;display:grid;place-items:center;background:#25d366;color:#fff}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:90;background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.sheet{z-index:70}#esheet{z-index:75}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ---------- Supabase: identical to index.html so the login session is shared ---------- */
const SB_URL='https://dgzltdkaumkprxijuoqv.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRnemx0ZGthdW1rcHJ4aWp1b3F2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4OTc2OTksImV4cCI6MjEwOTQ3MzY5OX0.rDMF7Dwp3QddBoXzhBFDn_QWI5k-j2o9sRAqtHmntuQ';
const rememberOn=()=>{try{return localStorage.getItem('sureoRemember')!=='0';}catch(e){return true;}};
const authStorage={
  getItem:k=>{try{return sessionStorage.getItem(k)||localStorage.getItem(k);}catch(e){return null;}},
  setItem:(k,v)=>{try{const keep=rememberOn();(keep?localStorage:sessionStorage).setItem(k,v);(keep?sessionStorage:localStorage).removeItem(k);}catch(e){}},
  removeItem:k=>{try{localStorage.removeItem(k);sessionStorage.removeItem(k);}catch(e){}}
};
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{storage:authStorage,persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});


/* ---------- State ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EMO={food:'🍽️',books:'📚',gadgets:'🔌',fashion:'👔',services:'🛠️'};
const CATS=[['all','All'],['food','Food'],['books','Books'],['gadgets','Gadgets'],['fashion','Fashion'],['services','Services']];
const st={cat:'all',q:'',campus:'all',mine:null};
let ITEMS=[],TIERS={},CAMPUSES=[],LIM=40,MORE=false,loading=true,failed=false,reqId=0;
let FAV=new Set();try{FAV=new Set(JSON.parse(localStorage.getItem('sureoFav')||'[]'));}catch(e){}
const campName=id=>id==='all'?'All campuses':((CAMPUSES.find(c=>c.id===id)||{}).name||'My campus');

/* ---------- Data ---------- */
async function load(){
  const my=++reqId;loading=true;failed=false;paint();
  let q=sb.from('listings').select('id,created_at,seller_id,campus_id,type,category,title,price_kobo,condition,course_code,profiles(full_name,is_seller_verified),listing_media(url,kind,position)').eq('status','active');
  if(st.campus!=='all')q=q.eq('campus_id',st.campus);
  const {data,error}=await q.order('created_at',{ascending:false}).limit(LIM);
  if(my!==reqId)return;
  loading=false;
  if(error){console.error(error);failed=true;paint();return;}
  MORE=data.length>=LIM;
  ITEMS=data.filter(l=>!l.created_at||Date.now()-new Date(l.created_at)<60*864e5).map(l=>{
    const ms=(l.listing_media||[]).slice().sort((a,b)=>a.position-b.position),im=ms.find(m=>m.kind==='image'),pr=l.profiles||{};
    return {id:l.id,sid:l.seller_id,cat:l.category,ty:l.type||'sell',title:l.title,p:Math.round(l.price_kobo/100),cond:l.condition,code:l.course_code,seller:pr.full_name||'Student',ver:!!pr.is_seller_verified,img:im&&im.url};
  });
  paint();loadTiers(data);
}
async function loadTiers(rows){
  try{
    const ids=[...new Set(rows.map(l=>l.seller_id))].filter(i=>!TIERS[i]);if(!ids.length)return;
    const r=await sb.from('seller_tiers').select('seller_id,tier').in('seller_id',ids);
    (r.data||[]).forEach(x=>TIERS[x.seller_id]=x.tier);paint();
  }catch(e){}
}
async function loadCampuses(){
  if(CAMPUSES.length)return;
  try{const r=await sb.from('campuses').select('id,name,type').order('name');if(r.data){CAMPUSES=r.data;$('campName').textContent=campName(st.campus);}}catch(e){}
}
async function findMyCampus(){ /* after first paint; never blocks the screen */
  try{
    const u=await AUTHP;if(!u)return;
    const p=await sb.from('profiles').select('campus_id').eq('id',u.id).maybeSingle();
    const cid=p.data&&p.data.campus_id;if(!cid)return;
    st.mine=cid;if(st.campus==='all'){st.campus=cid;load();}
  }catch(e){}
}

/* ---------- Render ---------- */
const money=i=>i.ty==='free'||i.p===0?'Free':'₦'+i.p.toLocaleString('en-NG');
function condCls(c){c=String(c||'').toLowerCase();return /brand|^new/.test(c)?'new':/like/.test(c)?'like':/fair|used/.test(c)?'used':'';}
function card(i){
  const t=TIERS[i.sid],f=FAV.has(String(i.id));
  return '<a class="card" href="#l='+esc(i.id)+'">'
   +'<div class="ph">'+(i.img?'<img src="'+esc(i.img)+'" alt="" loading="lazy" decoding="async">':EMO[i.cat]||'🛍️')
   +(i.cond&&!/^n\/?a/i.test(i.cond)?'<span class="tag '+condCls(i.cond)+'">'+esc(String(i.cond).replace(/_/g,' '))+'</span>':'')
   +'<button class="heart'+(f?' on':'')+'" data-fav="'+esc(i.id)+'" aria-label="Save"><svg class="ic"><use href="#i-heart"/></svg></button></div>'
   +'<div class="cbody"><div class="ttl">'+esc(i.title)+'</div>'
   +'<div class="pr"><span class="price">'+money(i)+'</span></div>'
   +'<div class="sel"><b>'+esc(i.seller)+'</b>'+(i.ver?'<svg class="ic"><use href="#i-tick"/></svg>':'')+(t==='trusted'?'<span class="trust">Trusted</span>':'')+'</div></div></a>';
}
function skeleton(){let h='';for(let k=0;k<6;k++)h+='<div class="skc"><i class="sk" style="aspect-ratio:1"></i><div style="padding:12px"><i class="sk" style="height:12px;width:80%;border-radius:6px;margin-bottom:8px"></i><i class="sk" style="height:12px;width:45%;border-radius:6px"></i></div></div>';return h;}
function visible(){
  const q=st.q.trim().toLowerCase();
  return ITEMS.filter(i=>(st.cat==='all'||i.cat===st.cat)&&(!q||(i.title+' '+i.seller+' '+(i.code||'')).toLowerCase().includes(q)));
}
function paint(){
  $('cats').innerHTML=CATS.map(c=>'<button class="chip'+(st.cat===c[0]?' on':'')+'" data-cat="'+c[0]+'">'+c[1]+'</button>').join('');
  $('campName').textContent=campName(st.campus);
  const g=$('grid'),mw=$('moreWrap');mw.innerHTML='';
  if(loading&&!ITEMS.length){g.innerHTML=skeleton();return;}
  if(failed){g.innerHTML='<div class="empty"><h3>Couldn’t load listings</h3>Check your connection and try again.<br><button class="btn" data-act="retry">Try again</button></div>';return;}
  const list=visible();
  g.innerHTML=list.length?list.map(card).join(''):'<div class="empty"><h3>No items found</h3>Try another category, or look on all campuses.<br><button class="btn" data-act="all">Show all campuses</button></div>';
  if(MORE&&!loading)mw.innerHTML='<button class="more" data-act="more">Show more</button>';
}

/* ---------- Campus sheet ---------- */
function paintCampuses(){
  const q=$('cq').value.trim().toLowerCase();
  const rows=[['all','All campuses','']].concat(CAMPUSES.filter(c=>!q||c.name.toLowerCase().includes(q)).slice(0,80).map(c=>[c.id,c.name,c.id===st.mine?'Your campus':'']));
  $('clist').innerHTML=rows.map(r=>'<button data-cid="'+esc(r[0])+'" class="'+(st.campus===r[0]?'on':'')+'"><span>'+esc(r[1])+'</span><small>'+esc(r[2])+'</small></button>').join('');
}
function setTheme(){
  const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('sureoTheme',t);}catch(e){}
}


/* ---------- Listing page (opens on #l=<id>) ---------- */
let FROMLIST=false;
const idFromHash=()=>{const m=location.hash.match(/^#l=([\w-]+)$/);return m?m[1]:null;};
const waNum=p=>{const d=String(p||'').replace(/\D/g,'');if(/^0\d{10}$/.test(d))return '234'+d.slice(1);if(/^234\d{10}$/.test(d))return d;return null;};
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
const ago=d=>{const n=Math.floor((Date.now()-new Date(d))/864e5);return n<=0?'today':n===1?'yesterday':n+' days ago';};
const TYLAB={sell:['Buy now','Sale'],rent:['Rent this','Rent'],trade:['Propose a trade','Trade'],free:['Get it free','Free']};
function dBack(){return '<div class="dbar"><button class="round" data-act="back" aria-label="Back"><svg class="ic"><use href="#i-back"/></svg></button>';}
async function openDetail(id){
  const el=$('detail');el.classList.add('open');document.body.style.overflow='hidden';el.scrollTop=0;
  el.innerHTML='<div class="dwrap"><div class="gwrap"><div class="gal sk"></div>'+dBack()+'</div></div><div class="dbody"><i class="sk" style="height:24px;width:70%;border-radius:8px"></i><i class="sk" style="height:28px;width:40%;border-radius:8px"></i></div></div>';
  const {data:l,error}=await sb.from('listings').select('id,created_at,seller_id,campus_id,type,category,title,price_kobo,condition,course_code,whatsapp,status,profiles(full_name,is_seller_verified,rating_avg,rating_count),listing_media(url,kind,position)').eq('id',id).maybeSingle();
  if(idFromHash()!==id)return;
  if(error||!l){el.innerHTML='<div class="dwrap"><div class="gwrap" style="height:70px">'+dBack()+'</div></div><div class="empty"><h3>'+(error?'Couldn’t load this listing':'Listing not found')+'</h3>'+(error?'Check your connection and try again.':'It may have been sold or removed.')+'</div></div>';return;}
  await loadCampuses();
  const pr=l.profiles||{},ms=(l.listing_media||[]).slice().sort((a,b)=>a.position-b.position),ty=l.type||'sell',lab=TYLAB[ty]||TYLAB.sell;
  const price=ty==='free'||!l.price_kobo?'Free':'₦'+Math.round(l.price_kobo/100).toLocaleString('en-NG');
  const exp=Math.max(0,60-Math.floor((Date.now()-new Date(l.created_at))/864e5)),wa=waNum(l.whatsapp),old='/#l='+esc(l.id);
  const slides=ms.length?ms.map(m=>'<div class="slide">'+(m.kind==='video'?'<video src="'+esc(m.url)+'" controls playsinline preload="metadata"></video>':'<img src="'+esc(m.url)+'" alt="" decoding="async">')+'</div>').join(''):'<div class="slide">'+(EMO[l.category]||'🛍️')+'</div>';
  const f=FAV.has(String(l.id));
  el.innerHTML='<div class="dwrap"><div class="gwrap"><div class="gal" id="gal">'+slides+'</div>'
   +dBack()+'<div style="display:flex;gap:8px"><button class="round'+(f?' on':'')+'" data-fav="'+esc(l.id)+'" aria-label="Save"><svg class="ic"><use href="#i-heart"/></svg></button><button class="round" data-act="share" data-id="'+esc(l.id)+'" data-t="'+esc(l.title)+'" data-p="'+(l.price_kobo?Math.round(l.price_kobo/100):0)+'" aria-label="Share"><svg class="ic"><use href="#i-share"/></svg></button></div></div>'
   +(ms.length>1?'<span class="cnt" id="cnt">1/'+ms.length+'</span>':'')+'</div>'
   +'<div class="dbody"><div><div class="dttl">'+esc(l.title)+'</div><div class="dprice">'+price+'</div></div>'
   +'<div class="facts"><span class="fact">'+lab[1]+'</span>'+(l.condition&&!/^n\/?a/i.test(l.condition)?'<span class="fact">'+esc(String(l.condition).replace(/_/g,' '))+'</span>':'')+(l.course_code?'<span class="fact code">'+esc(l.course_code)+'</span>':'')+'<span class="fact">'+esc(l.category)+'</span><span class="fact">'+esc(campName(l.campus_id))+'</span></div>'
   +'<div class="scard"><div class="av">'+esc((pr.full_name||'S').charAt(0).toUpperCase())+'</div><div style="min-width:0"><div class="sn">'+esc(pr.full_name||'Student')+(pr.is_seller_verified?'<svg class="ic"><use href="#i-tick"/></svg>':'')+'<span class="trust" id="dtier" hidden>Trusted</span></div><div class="ss">'+(+pr.rating_count?'★ '+(+pr.rating_avg).toFixed(1)+' · '+pr.rating_count+' review'+(pr.rating_count==1?'':'s'):'No reviews yet')+'</div></div></div>'
   +'<div class="safe">Meet on campus in a public place and check the item before you pay. Posted '+ago(l.created_at)+', expires in '+exp+' day'+(exp==1?'':'s')+'.</div></div></div>'
   +'<div class="dact"><div><a class="buy" href="'+old+'">'+lab[0]+'</a>'+(ty==='sell'?'<a class="alt" href="'+old+'">Make offer</a>':'')
   +(wa?'<a class="wa" target="_blank" rel="noopener" aria-label="Chat on WhatsApp" href="https://wa.me/'+wa+'?text='+encodeURIComponent('Hi! I saw "'+l.title+'" on Sureo.')+'"><svg class="ic" style="stroke:#fff"><use href="#i-chat"/></svg></a>':'')+'</div></div>';
  const g=$('gal'),c=$('cnt');if(g&&c)g.addEventListener('scroll',()=>{c.textContent=(Math.round(g.scrollLeft/g.clientWidth)+1)+'/'+ms.length;},{passive:true});
  try{const t=await sb.from('seller_tiers').select('tier').eq('seller_id',l.seller_id).maybeSingle();const b=$('dtier');if(b&&t.data&&t.data.tier==='trusted')b.hidden=false;}catch(e){}
}
function closeDetail(){$('detail').classList.remove('open');$('detail').innerHTML='';document.body.style.overflow='';paint();}
function route(){
  const id=idFromHash();
  if(isProfileRoute()){closeDetail();showProfile();return;}
  document.body.classList.remove('pv');setNav('home');
  if(id)openDetail(id);else closeDetail();
}
window.addEventListener('hashchange',route);
async function shareListing(b){
  const url=location.origin+'/l/'+String(b.dataset.id).slice(0,8),p=+b.dataset.p,txt='Check this on Sureo: '+b.dataset.t+(p?' for ₦'+p.toLocaleString('en-NG'):'')+' (verified campus students)';
  if(navigator.share){try{await navigator.share({title:b.dataset.t,text:txt,url});}catch(e){}return;}
  try{await navigator.clipboard.writeText(txt+' '+url);toast('Link copied');}catch(e){window.open('https://wa.me/?text='+encodeURIComponent(txt+' '+url),'_blank');}
}

/* ---------- Session: same 20-minute inactivity rule as the old app (they share one login) ---------- */
const IDLE_MS=20*60*1000;let ME=null,lastAct=Date.now(),MY=[],MYPROF=null;
function touchActive(){if(!ME)return;const n=Date.now();if(n-lastAct>5000){lastAct=n;try{localStorage.setItem('sureoLast',n);}catch(e){}}}
['click','touchstart','keydown','scroll'].forEach(ev=>window.addEventListener(ev,touchActive,{passive:true,capture:true}));
async function logout(msg){
  try{await sb.auth.signOut();}catch(e){}
  ME=null;MY=[];MYPROF=null;st.mine=null;try{localStorage.removeItem('sureoLast');localStorage.removeItem('sureoView');}catch(e){}
  toast(msg||'Logged out. See you soon!');if(isProfileRoute())showProfile();
}
function checkIdle(){if(!ME)return;let l=lastAct;try{l=Math.max(l,+localStorage.getItem('sureoLast')||0);}catch(e){}if(Date.now()-l>=IDLE_MS)logout('You were logged out after 20 minutes of inactivity.');}
setInterval(checkIdle,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkIdle();});
async function initAuth(){
  try{
    const {data}=await sb.auth.getSession();const s=data&&data.session;if(!s)return null;
    let l=0;try{l=+localStorage.getItem('sureoLast')||0;}catch(e){}
    if(l&&Date.now()-l>=IDLE_MS){await sb.auth.signOut();return null;}
    ME=s.user;touchActive();return ME;
  }catch(e){return null;}
}
const AUTHP=initAuth();

/* ---------- Profile (opens on #profile or #items) ---------- */
const isProfileRoute=()=>/^#(profile|items)$/.test(location.hash);
function setNav(n){[['nHome','home'],['nItems','items'],['nProf','profile']].forEach(x=>$(x[0]).classList.toggle('on',x[1]===n));}
const statusOf=l=>l.status==='active'&&Date.now()-new Date(l.created_at)>=60*864e5?'expired':l.status;
async function showProfile(){
  document.body.classList.add('pv');setNav(location.hash==='#items'?'items':'profile');window.scrollTo(0,0);
  const el=$('profileView');
  if(!ME){el.innerHTML='<div class="ph1"><div class="pav">S</div><div><div class="pname">Your profile</div><div class="ss">Sign in to see your listings and rating.</div></div></div><a class="btn" href="/">Sign in</a>';await AUTHP;if(!ME)return;}
  el.innerHTML='<div class="ph1"><div class="pav sk"></div><div class="sk" style="height:22px;width:50%;border-radius:8px"></div></div>';
  const [p,m]=await Promise.all([
    sb.from('profiles').select('full_name,is_seller_verified,rating_avg,rating_count,campus_id').eq('id',ME.id).maybeSingle(),
    sb.from('listings').select('id,title,price_kobo,status,type,created_at').eq('seller_id',ME.id).order('created_at',{ascending:false}).limit(100)]);
  if(!isProfileRoute()||!ME)return;
  await loadCampuses();
  MYPROF=p.data||{};MY=m.data||[];const pr=MYPROF,rc=+pr.rating_count||0;
  const nm=pr.full_name||'Student';
  el.innerHTML='<div class="ph1"><div class="pav">'+esc(nm.charAt(0).toUpperCase())+'</div><div style="min-width:0"><div class="pname">'+esc(nm)+(pr.is_seller_verified?'<svg class="ic"><use href="#i-tick"/></svg>':'')+'<span class="trust" id="ptier" hidden>Trusted</span></div><div class="ss">'+esc(pr.campus_id?campName(pr.campus_id):'No campus set')+'</div></div></div>'
   +'<div class="pstats"><div><b>'+(rc&&pr.rating_avg?'★ '+(+pr.rating_avg).toFixed(1):'–')+'</b><span>Rating</span></div><div><b>'+MY.length+'</b><span>Listings</span></div><div><b>'+rc+'</b><span>Reviews</span></div></div>'
   +'<div class="ptl" id="mine">My listings</div>'
   +(MY.length?MY.map(l=>{const s=statusOf(l),pz=l.price_kobo?'₦'+Math.round(l.price_kobo/100).toLocaleString('en-NG'):(l.type==='trade'?'Trade':'Free');
     return '<div class="mrow"><div class="t">'+esc(l.title)+'</div><div class="s">'+pz+' · <span class="st '+esc(s)+'">'+esc(s)+'</span> · posted '+ago(l.created_at)+'</div><div class="macts"><button data-ma="edit" data-id="'+esc(l.id)+'">Edit</button><button class="'+(s==='expired'?'pri':'')+'" data-ma="renew" data-id="'+esc(l.id)+'">Renew</button><button data-ma="sold" data-id="'+esc(l.id)+'">'+(l.status==='sold'?'Make live again':'Mark as sold')+'</button></div></div>';}).join(''):'<div class="mrow"><div class="t">No listings yet</div><div class="s">Tap Sell to post your first item.</div></div>')
   +'<div class="ptl">More</div>'
   +'<button class="lrow" data-act="store"><span>Share my shop link</span><small>Send buyers here</small></button>'
   +'<button class="lrow" data-act="theme"><span>Dark mode</span><small>Switch</small></button>'
   +'<a class="lrow" href="/"><span>Orders and receipts</span><small>Open in old app</small></a>'
   +'<a class="lrow" href="/"><span>Identity and account</span><small>Open in old app</small></a>'
   +'<button class="lrow out" data-act="logout"><span>Log out</span></button>';
  if(location.hash==='#items'){const t=$('mine');if(t)t.scrollIntoView();}
  try{const t=await sb.from('seller_tiers').select('tier').eq('seller_id',ME.id).maybeSingle();const b=$('ptier');if(b&&t.data&&t.data.tier==='trusted')b.hidden=false;}catch(e){}
}
let editId=null;
async function myAction(b){
  const a=b.dataset.ma,l=MY.find(x=>x.id===b.dataset.id);
  if(a==='cancel'){$('esheet').classList.remove('open');return;}
  if(a==='save'){
    const name=$('eName').value.trim(),pz=Math.max(0,Math.round(+$('ePrice').value||0));if(!name){$('eName').focus();return;}
    const {error}=await sb.from('listings').update({title:name,price_kobo:pz*100}).eq('id',editId).eq('seller_id',ME.id);
    if(error){toast('Could not save: '+error.message);return;}
    $('esheet').classList.remove('open');toast('Listing updated');showProfile();load();return;
  }
  if(!l||!ME)return;
  if(a==='edit'){editId=l.id;$('eName').value=l.title;$('ePrice').value=Math.round(l.price_kobo/100);$('esheet').classList.add('open');return;}
  if(a==='renew'){const {error}=await sb.from('listings').update({created_at:new Date().toISOString()}).eq('id',l.id).eq('seller_id',ME.id);if(error){toast('Could not renew: '+error.message);return;}toast('Renewed. It is back at the top.');}
  if(a==='sold'){const next=l.status==='sold'?'active':'sold';const {error}=await sb.from('listings').update({status:next}).eq('id',l.id).eq('seller_id',ME.id);if(error){toast('Could not update: '+error.message);return;}toast(next==='sold'?'Marked as sold. It is hidden from the market.':'Listing is live again.');}
  showProfile();load();
}
async function shareStore(){
  const nm=((MYPROF&&MYPROF.full_name)||'').trim().split(' ')[0].toLowerCase().replace(/[^a-z0-9]/g,'')||'shop';
  const url=location.origin+'/s/'+nm+'-'+String(ME.id).slice(0,8),txt='Shop my listings on Sureo, the verified campus marketplace: ';
  if(navigator.share){try{await navigator.share({title:'My Sureo shop',text:txt,url});}catch(e){}return;}
  try{await navigator.clipboard.writeText(url);toast('Shop link copied');}catch(e){window.open('https://wa.me/?text='+encodeURIComponent(txt+url),'_blank');}
}

/* ---------- Events: one delegated listener, so late-added elements always work ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('a.card')&&!e.target.closest('[data-fav]'))FROMLIST=true;
  const t=e.target.closest('[data-fav],[data-cat],[data-act],[data-cid],[data-ma]');
  if(!t){if(e.target===$('sheet'))$('sheet').classList.remove('open');if(e.target===$('esheet'))$('esheet').classList.remove('open');return;}
  if(t.dataset.fav){
    e.preventDefault();const id=t.dataset.fav;FAV.has(id)?FAV.delete(id):FAV.add(id);
    try{localStorage.setItem('sureoFav',JSON.stringify([...FAV]));}catch(x){}
    t.classList.toggle('on',FAV.has(id));return;
  }
  if(t.dataset.ma){myAction(t);return;}
  if(t.dataset.cat){st.cat=t.dataset.cat;paint();}
  else if(t.dataset.cid){st.campus=t.dataset.cid;$('sheet').classList.remove('open');load();}
  else if(t.dataset.act==='campus'){$('sheet').classList.add('open');$('cq').value='';paintCampuses();loadCampuses().then(paintCampuses);}
  else if(t.dataset.act==='theme')setTheme();
  else if(t.dataset.act==='back'){if(FROMLIST){FROMLIST=false;history.back();}else{history.replaceState(null,'',location.pathname+location.search);closeDetail();}}
  else if(t.dataset.act==='share')shareListing(t);
  else if(t.dataset.act==='focus'){if(location.hash)location.hash='';window.scrollTo(0,0);setTimeout(()=>$('q').focus(),50);}
  else if(t.dataset.act==='store')shareStore();
  else if(t.dataset.act==='logout'){if(confirm('Log out of Sureo?'))logout();}
  else if(t.dataset.act==='retry')load();
  else if(t.dataset.act==='all'){st.campus='all';load();}
  else if(t.dataset.act==='more'){LIM+=40;load();}
});
$('q').addEventListener('input',e=>{st.q=e.target.value;paint();});
$('cq').addEventListener('input',paintCampuses);

/* ---------- Start: show the screen and listings at once, resolve campus in the background ---------- */
paint();load();loadCampuses();findMyCampus();route();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
