:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--primary:#0d4a3a;--pl:#e8f3ef;--border:#e5e7eb;--accent:#0d4a3a}
@media(prefers-color-scheme:dark){:root{--bg:#0b1210;--card:#131c19;--text:#e8f0ed;--muted:#8fa39b;--pl:#183029;--border:#243630;--accent:#5fd0ab}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:110px;-webkit-font-smoothing:antialiased}
.top{display:flex;align-items:center;justify-content:space-between;padding:max(12px,env(safe-area-inset-top)) 16px 12px;background:var(--card);border-bottom:1px solid var(--border)}
.logo{display:block;height:38px;padding:7px 12px;border-radius:12px;background:var(--primary)}
.logo img{height:100%;display:block}
.top a.open{font-weight:700;font-size:14px;color:var(--accent);text-decoration:none}
main{max-width:560px;margin:0 auto}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;background:var(--pl);-webkit-overflow-scrolling:touch}
.gal>*{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/3;object-fit:cover;width:100%;background:var(--pl)}
.ph{display:flex;align-items:center;justify-content:center;font-size:64px}
.cnt{position:relative}
.cnt span{position:absolute;right:12px;bottom:12px;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600}
.card{margin:14px 16px;padding:18px;border-radius:18px;background:var(--card);border:1px solid var(--border)}
h1{font-size:21px;line-height:1.25;margin-bottom:8px}
.price{font-size:26px;font-weight:800;color:var(--accent);margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:99px;background:var(--pl);color:var(--accent)}
.seller{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;background:var(--pl);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.seller b{display:block;font-size:15px}.seller small{color:var(--muted);font-size:13px}
.trust{list-style:none;display:flex;flex-direction:column;gap:10px;font-size:14px}
.trust li{display:flex;gap:10px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px max(14px,env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--border)}
.btn{display:block;max-width:528px;margin:0 auto;text-align:center;padding:15px;border-radius:14px;background:var(--primary);color:#fff;font-weight:700;font-size:16px;text-decoration:none}
.bar small{display:block;text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
.msg{text-align:center;padding:60px 24px}.msg h2{margin-bottom:10px}.msg p{color:var(--muted);margin-bottom:22px}
.msg .btn{display:inline-block;padding:14px 26px}
.sk{margin:14px 16px;height:260px;border-radius:18px;background:var(--pl);animation:p 1.2s infinite alternate}@keyframes p{to{opacity:.5}}
</style></head><body>

(async function(){

  $('app').innerHTML=gal
   +'<div class="card"><h1>'+esc(l.title)+'</h1><div class="price">'+price+'</div><div class="chips">'+chips+'</div></div>'
   +'<div class="card seller"><div class="av">'+esc(l.seller.charAt(0).toUpperCase())+'</div><div><b>'+esc(l.seller)+(l.tier==='trusted'?' 🏅':l.verified?' ✅':'')+'</b><small>'+(l.tier==='trusted'?'Trusted seller':l.verified?'Verified seller':'New seller')+rated+'</small>'+(l.seller_key?'<a href="/s/'+esc(l.seller.toLowerCase().replace(/[^a-z0-9]/g,'')||'shop')+'-'+esc(l.seller_key)+'" style="display:block;margin-top:4px;font-size:13px;font-weight:700;color:var(--accent);text-decoration:none">See all listings →</a>':'')+'</div></div>'
   +'<div class="card"><ul class="trust"><li>🔒<span>Pay safely online with Paystack, or pay on delivery</span></li><li>📍<span>Meet at a campus safety hub</span></li><li>🔑<span>Handover codes confirm every sale</span></li><li>🏅<span><b>Trusted</b> sellers are ID-verified, with 3 or more confirmed handovers and no open disputes</span></li></ul></div>';
  $('cta').href='/#l='+encodeURIComponent(l.id);
  $('bar').hidden=false;
  const g=document.querySelector('.gal');
  if(g&&media.length>1)g.addEventListener('scroll',()=>{$('cn').textContent=(Math.round(g.scrollLeft/g.clientWidth)+1)+' / '+media.length;},{passive:true});
})();
</script></body></html>
